<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- home-screen icon: the robot's flat face, drawn from the game's own
     SKIN palette (bodyTop hull, visor brow, eye light, stripe band) —
     without it iOS screenshots the page for bookmarks. -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- THE VISUAL VIEWPORT, MEASURED AND PUBLISHED AS CSS VARS
     (2026-08-27). Sir on-device: the boot loader "starts in the bottom
     right then moves to the center", reproducing in a HOME-SCREEN WEB
     APP on iPad and not in ordinary Safari.

     #bootLoader is position:fixed;inset:0 and paints on the first frame
     by design -- that is the whole reason it is static markup rather
     than JS-injected. So wherever it lands IS wherever the browser
     thought the viewport was at that instant. Reconstructed from
     IMG_3133 the box was about 1710x1200 against a 1194x834 device, and
     the two have essentially the same ASPECT (1.425 vs 1.432). A window
     resize changes aspect; a uniform scale at constant aspect does not.
     That is the layout viewport being wider at first paint and
     narrowing once it settles -- which is exactly what a standalone
     launch does, resolving its viewport during the launch animation.

     visualViewport is the more reliable signal here for the same reason
     tipsey-delivery's viewport-fix.js gives for preferring it: it
     tracks the actual visible area directly and fires its own resize
     independent of the window's. This publishes all four numbers, not
     just height as that file does, because the offset is what makes the
     centre right rather than merely the size.

     INLINE AND FIRST, immediately after the meta and ahead of every
     stylesheet: the vars have to exist before the loader is parsed or
     the first paint uses the fallbacks and we are back where we
     started. Inline is fine on Pages. The Devvit copy carries the same
     block and will not execute there under script-src 'self' (the same
     CSP that stranded viewport-fix.js -- see its header); that build
     already loads viewport-fix.js and can be moved onto this properly
     if the bug ever shows up there, which so far it has not. -->
<script>
(function(){
  var d = document.documentElement;
  function vv(){
    var v = window.visualViewport;
    var w = (v && v.width)  || window.innerWidth;
    var h = (v && v.height) || window.innerHeight;
    var l = (v && v.offsetLeft) || 0, t = (v && v.offsetTop) || 0;
    d.style.setProperty("--vvw", w + "px");
    d.style.setProperty("--vvh", h + "px");
    d.style.setProperty("--vvl", l + "px");
    d.style.setProperty("--vvt", t + "px");
    return w + "x" + h + " @" + l + "," + t;
  }
  var first = vv();
  addEventListener("resize", vv);
  addEventListener("orientationchange", vv);
  if(window.visualViewport){
    visualViewport.addEventListener("resize", vv);
    visualViewport.addEventListener("scroll", vv);
  }

  /* ---- SELF-ARMING TRACE ----
     The earlier version of this armed on ?vpdiag=1, which was useless
     for the one person who needed it: a home-screen web app launches a
     FROZEN url and there is no way to append a query string to it. So
     it arms itself instead, and only on evidence -- it records the
     viewport at first script and then watches, and it puts anything on
     screen ONLY if the viewport actually changes after that. A device
     whose viewport is settled at first paint shows nothing, ever, which
     is every player. A device where it moves shows the numbers that
     explain why, without anyone having to arm anything.

     ?vpdiag=1 still forces it on for testing in a normal browser. */
  var forced = false;
  try{ forced = new URLSearchParams(location.search).get("vpdiag") === "1"; }catch(e){}
  var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
  var trace = [{ t: 0, tag: "first-script", vv: first,
                 inner: innerWidth + "x" + innerHeight,
                 client: d.clientWidth + "x" + d.clientHeight }];
  var changed = false, lastKey = first + "|" + innerWidth + "x" + innerHeight;
  window.__vpTrace = trace;
  function paint(){
    if(!changed && !forced) return;
    var el = document.getElementById("blDiag");
    if(!el) return;
    el.textContent = trace.map(function(r){
      return r.t + "ms " + r.tag + "  vis " + r.vv + "  inner " + r.inner + "  client " + r.client;
    }).join("\n") + "\nscreen " + screen.width + "x" + screen.height + " dpr " + devicePixelRatio;
  }
  function sample(tag){
    var v = window.visualViewport;
    var cur = ((v ? Math.round(v.width) + "x" + Math.round(v.height) + " @" + Math.round(v.offsetLeft) + "," + Math.round(v.offsetTop) : "-"))
            + "|" + innerWidth + "x" + innerHeight;
    if(cur === lastKey) return;
    lastKey = cur; changed = true;
    trace.push({ t: Math.round((((window.performance && performance.now) ? performance.now() : Date.now())) - t0),
                 tag: tag, vv: v ? (Math.round(v.width) + "x" + Math.round(v.height) + " @" + Math.round(v.offsetLeft) + "," + Math.round(v.offsetTop)) : "-",
                 inner: innerWidth + "x" + innerHeight, client: d.clientWidth + "x" + d.clientHeight });
    paint();
  }
  addEventListener("resize", function(){ sample("resize"); });
  addEventListener("orientationchange", function(){ sample("orientationchange"); });
  if(window.visualViewport){
    visualViewport.addEventListener("resize", function(){ sample("vv-resize"); });
    visualViewport.addEventListener("scroll", function(){ sample("vv-scroll"); });
  }
  /* poll for 3s as well: the transition may land without firing any
     event at all, and that would itself be the finding */
  (function tick(){
    sample("frame");
    if((((window.performance && performance.now) ? performance.now() : Date.now())) - t0 < 3000) requestAnimationFrame(tick);
  })();
  addEventListener("load", function(){ paint(); setTimeout(paint, 400); });
  try{ setTimeout(function(){ localStorage.setItem("tpVpTrace", JSON.stringify(trace)); }, 3200); }catch(e){}
})();
</script>
<title>TIPSEY — a clumsy delivery</title>
<style>
  html,body{margin:0;padding:0;background:#14161b;height:100%;height:100dvh;height:var(--vvh, 100dvh);overflow:hidden;touch-action:none;
    font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;-webkit-user-select:none;user-select:none;color:#e8eaef;}
  #wrap{display:flex;flex-direction:column;height:100%;}
  #game{flex:1;min-height:0;}
  /* 62px BOTH sides — #globalSearch top-left now needs the same gutter
     #globalAvatar has at top-right. (Devvit hides #panel outright; kept
     identical to game/index.html so the two never drift.) */
  #panel{padding:calc(10px + env(safe-area-inset-top)) 62px 8px 62px;background:#1c1f26;border-bottom:1px solid #2b2f38;}
  #panelToggle{position:fixed;left:50%;top:56px;transform:translateX(-50%);
    color:#8f95a1;font-size:13px;letter-spacing:1px;padding:4px 12px;z-index:5;}
  #panelToggle:active{opacity:0.6;}
  #panelToggle.flipped{transform:translateX(-50%) rotate(180deg);}
  .row{display:flex;gap:8px;align-items:center;}
  .lbl{font-size:11px;letter-spacing:1.5px;color:#8f95a1;width:56px;text-transform:uppercase;}
  button{flex:1;background:#262a33;color:#e8eaef;border:1px solid #363b46;border-radius:10px;
    padding:10px 4px;font-size:13px;font-weight:600;}
  button.on{background:#ff7a1a;border-color:#ff7a1a;color:#fff;}
  button:active{transform:scale(0.96);}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(18,20,26,.86);color:#fff;text-align:center;z-index:10;padding:24px;}
  .overlay h1{font-size:52px;margin:0 0 4px;letter-spacing:2px;}
  .overlay h2{font-size:28px;margin:0 0 8px;}
  .overlay p{font-size:16px;line-height:1.5;color:#cfd3dc;max-width:330px;margin:5px 0;}
  .overlay .card{background:#20242d;border:1px solid #363b46;border-radius:14px;padding:14px 22px;margin:10px 0;}
  .overlay .card b{color:#ff9c4d;}
  .overlay .btn{margin-top:18px;background:#ff7a1a;color:#fff;border:none;border-radius:14px;
    padding:15px 44px;font-size:19px;font-weight:700;box-shadow:0 4px 0 #b5540e;}
  .overlay .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b5540e;}
  #failOverlay{background:rgba(18,20,26,0);}
  #failOverlay h2,#failOverlay p{text-shadow:0 2px 3px #b5540e;transform:translateY(-135px);}
  #failOverlay p{color:#fff;}
  /* matched to the challenge's TAP button: same size, radius, shadow and
     press travel, so Retry sits exactly where TAP was and reads as the
     same control */
  #failOverlay .btn{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);
    flex:none;width:88px;height:88px;border-radius:50%;padding:0;margin-top:0;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:700;letter-spacing:1px;box-shadow:0 4px 0 #b5540e;}
  #failOverlay .btn:active{transform:translateX(-50%) translateY(3px);box-shadow:0 1px 0 #b5540e;}
  /* MAYBE LATER (2026-08-26, Sir's call). The quiet half of the fail
     card, and deliberately NOT a second pill: Retry keeps the 88px
     orange circle every primary action in this game wears (TAP, GO,
     Retry are one control in three places), and the way out sits under
     it as plain text so the two never read as an equal pair. Retry is
     the offer; free play is the door. */
  #failLaterBtn{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    background:none;border:none;padding:10px 20px;color:#fff;opacity:.85;
    font-size:15px;font-weight:600;letter-spacing:.3px;
    text-shadow:0 2px 3px #b5540e;-webkit-tap-highlight-color:transparent;}
  #failLaterBtn:active{opacity:1;transform:translateX(-50%) translateY(2px);}
  #winOverlay{background:rgba(18,20,26,0);}
  #winOverlay h2,#winOverlay p{text-shadow:0 2px 3px #b5540e;transform:translateY(-165px);}
  #winOverlay p{color:#fff;}
  /* Again's old #winOverlay .btn rule (88px circle, bottom-anchored to
     clear the receipt card) is gone along with the button -- FOLLOW,
     COMMENT and the explore icon row that replaced it are all styled
     and positioned inline from game-logic.js (twFxFollowBtn,
     twFxCommentBtn, showWin's stackBase math), the same
     zero-HTML-divergence approach the fail screen's tdFx buttons
     already used, so there is nothing left here for a CSS class to
     style. */
  /* matches #bottomSheet's recipe exactly (same cream, same padding, same
     safe-area fold) plus the 20px bottom curve it can't inherit: the map
     screen gets its corners from #screenWrap's border-radius+overflow
     clip, but the win overlay lives outside that wrapper. */
  #winCard{position:absolute;left:0;right:0;bottom:0;margin:0;
    background:#f0ece0;color:#2e3138;border:none;border-radius:0 0 20px 20px;
    padding:12px 16px calc(10px + env(safe-area-inset-bottom));}
  #winCard .sheetRow + .sheetRow{margin-top:3px;}
  #winCard .sheetRow{display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;line-height:1.1;}
  #winCard b{color:#b5540e;}
  .tag{color:#ff9c4d;font-weight:700;letter-spacing:1px;font-size:12px;text-transform:uppercase;}
  .brand{font-size:18px;font-weight:800;letter-spacing:1px;color:#ff7a1a;margin-bottom:8px;}
  #routeMap{display:block;}
  /* ---------- ATTRACT MODE (splash) ----------
     The Phaser world has ALWAYS been live behind #titleOverlay. new
     Phaser.Game runs at page load and WorldScene builds and renders the
     city immediately -- the overlay's own background plus the opaque
     #routeMap canvas were the only things hiding it. So attract mode
     does not start a second renderer or a preview loop. It uncovers the
     one that was already running. Everything below is subtractive.

     #routeMap is hidden rather than skipped, and drawRouteMap() keeps
     running against it on purpose: the challenge flow (hjStart/hjQuit)
     reads that map, and leaving it drawn-but-invisible means toggling
     attract off is a class change rather than a redraw -- which is what
     kept hjQuit's "SHOW THE OVERLAY FIRST" ordering bug from having a
     second front to fight on. */
  /* BARE attract (splash embed): the game's own UI is suppressed
     entirely -- the splash card supplies title, leaderboard and the
     Start Delivery button, and two stacked UIs on one feed card is
     worse than either alone. display:none rather than opacity so none
     of it can take a tap that belongs to the splash. */
  body.attractBare #titleOverlay,
  body.attractBare #panel,
  body.attractBare #panelToggle,
  body.attractBare #gpsHud,
  body.attractBare #miniMap,
  body.attractBare #zoomBtn,
  body.attractBare #bottomSheet,
  body.attractBare #globalAvatar,
  body.attractBare #globalSearch,
  body.attractBare #bootLoader { display: none !important; }
  body.attract #titleOverlay{background:transparent;}
  body.attract #mapCard{background:transparent;}
  body.attract #routeMap{visibility:hidden;}
  /* Giving up the scrim means the title chrome is now light-on-light
     against a bright daytime street, so it has to carry its own
     contrast. Top and bottom only -- the middle band stays fully clear
     so the robot is never veiled by the thing making the logo legible. */
  body.attract #mapCard::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,
      rgba(18,20,26,.74) 0%, rgba(18,20,26,.30) 20%,
      rgba(18,20,26,0) 44%, rgba(18,20,26,0) 60%,
      rgba(18,20,26,.58) 100%);}
  /* ::before paints in front of non-positioned content, so the chrome
     has to be lifted above it explicitly or the gradient covers the GO
     button. z-index only -- .brand/.card/.btn/.iconBtn are already
     absolutely positioned by the #mapCard rules above and restating
     position here would drop them back into flow. */
  body.attract #mapCard .brand,
  body.attract #mapCard .card,
  body.attract #mapCard .btn,
  body.attract #mapCard .iconBtn{z-index:2;}
  #titleOverlay{padding:0;justify-content:flex-start;}
  /* --sheetH is the bottom sheet's RESTING height, and it is one
     constant answering one question: how much of the map's bottom edge
     the sheet covers. #bottomSheet floats over the map now rather than
     taking a row of its own (see its rule), so the GO button is the one
     thing that has to know this number -- everything else is anchored to
     an edge. Change it here or nowhere. */
  #screenWrap{width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;
    border-radius:20px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.35);
    position:relative;
    --sheetH:calc(58px + env(safe-area-inset-bottom));} /* positioning context for the tp* panels' inset:0 */
  #mapCard{position:relative;width:100%;flex:1;min-height:0;overflow:hidden;}
  #mapCard .brand{position:absolute;top:14px;left:50%;transform:translateX(-50%);margin:0;text-shadow:0 1px 4px rgba(181,84,14,.9),0 1px 4px rgba(181,84,14,.9);}
  #mapCard .card{position:absolute;top:60px;left:12px;right:12px;margin:0;background:rgba(240,236,224,.55);color:#2e3138;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
  #mapCard .card b{color:#b5540e;}
  /* clears the floating sheet. GO used to sit 16px off #mapCard's bottom
     and that WAS the sheet's top edge, because the sheet was a flex
     sibling holding its own row open. Now the sheet overlays, so the
     same 16px would park GO underneath it. */
  #mapCard .btn{position:absolute;bottom:calc(16px + var(--sheetH));left:50%;transform:translateX(-50%);margin-top:0;
    width:88px;height:88px;border-radius:50%;padding:0;
    display:flex;align-items:center;justify-content:center;}
  #mapCard .btn:active{transform:translateX(-50%) translateY(3px);}
  .iconBtn{position:absolute;top:12px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);
    display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.25);}
  #searchIcon{left:14px;}
  #avatarIcon{right:14px;background:#ff7a1a;}
  /* Just the order status now. The Past Routes pill and its ︿ chevron
     are gone — Past Routes moved into its own fixed panel and is reached
     from the magnifying glass, which is on screen everywhere the sheet
     is and plenty of places it isn't. Two doors into the same room, one
     of them only openable from the map, was the worse half. The sheet no
     longer expands either; nothing lives under it. */
  /* box-sizing: width:100% + 16px of side padding made this 32px wider
     than #screenWrap. The overflow was invisible because #screenWrap
     clips it, but it pushed the row's content box 16px right — fine
     when three items shared the row, obvious now that the centred
     status line is the only thing in it. */
  /* FLOATS OVER THE MAP, AND THE MAP NEVER RESIZES AGAIN (Sir's call,
     2026-08-26: "lets stop resizing the map when we open the bottom card
     to see the missions its buggy and i dont think we need it").

     This was a flex sibling of #mapCard, which is the whole story: the
     drawer inside it changing height changed #mapCard's height, #mapCard
     is what resizeRouteMap measures, and nothing fired on that change --
     so the canvas kept a stale size and the live Phaser world showed
     through the gap. tpSheetReflow existed to chase that with an
     rAF loop for the length of the animation. Taking the sheet out of
     flow deletes the cause instead of chasing the symptom: #mapCard is
     now the full height of #screenWrap, forever, and the drawer grows
     upward over it. tpSheetReflow is gone with it.

     Glass, same recipe as #tpProfSheet -- rgba tint plus backdrop-filter
     both prefixed and not -- so the map reads through the sheet the way
     it reads through the store pop-out. Now that it overlays the map
     there is finally something behind it worth seeing; as a flex row it
     had only the dark .overlay wash behind it and frosting would have
     bought nothing.

     max-height caps the drawer's expansion; the sheet is anchored
     bottom:0 so growing it grows upward on its own, no anchoring math. */
  /* z-index 7, not 3: the map's own chrome (the zoom pills, the search
     bar) is injected at z-index 6 inside #mapCard, and #mapCard sets no
     z-index of its own -- it is position:relative but not a stacking
     context -- so those children compete with this element directly.
     At 3 the zoom pills painted straight through the raised drawer. */
  #bottomSheet{position:absolute;left:0;right:0;bottom:0;z-index:7;
    box-sizing:border-box;color:#2e3138;
    background:rgba(243,239,229,.74);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    backdrop-filter:blur(20px) saturate(150%);
    border-top:1px solid rgba(255,255,255,.5);
    border-radius:20px 20px 0 0;
    box-shadow:0 -8px 28px rgba(20,22,27,.18);
    display:flex;flex-direction:column;min-height:0;max-height:72vh;
    padding:12px 16px calc(10px + env(safe-area-inset-bottom));}
  #bottomSheet .sheetRow{flex:none;display:flex;align-items:center;gap:8px;}
  #bottomSheet .status{flex:1;min-width:0;font-weight:700;font-size:15px;color:#b5540e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;}

  /* PAST ROUTES IS GONE (2026-08-25, Sir's call: "we get rid of the idea
     of past routes completely. no more past routes in the game play").
     Panel, list, all-time header and the whole replay entry are removed.
     What SURVIVES is tpProfile.history and tpProfile.allTimeTotal --
     those are the record of days delivered and what the trophies read,
     not the replay feature. */

  /* ---------- win/fail: a way back to the route picker. Placed at the
     top, well clear of the bottom card/button geometry. ---------- */
  /* the fail screen's button is now the same magnifying glass the map
     uses, in the same place and with the same job: open Side Missions.
     .iconBtn supplies the circle; this only positions it. */
  .menuBtn{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;z-index:2;
    flex:none;padding:0;border:none;}
  .menuBtn:active{transform:scale(0.94);}
  /* the same pair the map screen carries: magnifier left, robot right */
  .failAvatar{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;
    z-index:2;background:#ff7a1a;cursor:pointer;}
  .failAvatar:active{transform:scale(0.94);}
  /* in-game GPS readout — DOM, not canvas text: the Phaser framebuffer
     renders at CSS resolution (Scale.RESIZE, no DPR handling; the world
     is drawn in CSS px via K, so retina-scaling the buffer would rescale
     the whole world), which is why canvas text looked fuzzy next to the crisp DOM
     DELIVERED/fail headlines. Same element class of fix as those
     headlines: native-DPR text with their exact shadow. */
  #gpsHud{position:fixed;left:50%;bottom:calc(3px + env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:4;pointer-events:none;white-space:nowrap;
    font-size:min(22px, 4.5vw);font-weight:700;color:#fff;text-shadow:0 2px 3px #b5540e;}
  /* WRONG WAY, IN THE ONLY COLOUR THIS GAME USES FOR TROUBLE. Same red
     the tilt gauge and the cargo bar go to, so it needs no learning.
     Toggled by drawHUD off gpsNavTurn's uturn/lead flags. */
  #gpsHud.navAlert{color:#ffd9d2;text-shadow:0 2px 3px #c2452e;}
  /* WHICH WAY, IN THE STRIP ITSELF (2026-08-27, Sir on-device: "can we
     get it to be a part of the gps so that it is replacing the arrow").
     Sized in em so it tracks #gpsHud's own min() font-size instead of
     needing a second breakpoint, and rotated about its centre by
     drawHUD off gpsAimErr. Art points UP at rotate(0) -- straight ahead
     is up, so zero error needs no offset. fill is set inline (the
     three-stop green/orange/red the tilt gauge already speaks), NOT
     currentColor: the strip's own white/navAlert-red is about the
     written instruction, this is about the angle. */
  #gpsChev{display:none;width:1em;height:1em;vertical-align:-0.12em;margin-right:0.3em;
    transform-origin:50% 50%;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.45));}
  #gpsChev.on{display:inline-block;}
  /* THE LIVE MINIMAP (see tpMiniDraw). Bottom-left: the four corners
     were spoken for at the TOP (#globalSearch, #globalAvatar, #zoomBtn)
     and the bottom centre is #gpsHud's strip, which is centre-anchored
     and grows both ways -- so the left corner, lifted clear of the
     strip's line. pointer-events:none because it is an instrument, not
     a control; the glass opens the real map. */
  #miniMap{position:fixed;left:14px;bottom:calc(38px + env(safe-area-inset-bottom));
    z-index:5;width:104px;height:104px;border-radius:14px;overflow:hidden;
    background:rgba(20,23,29,0.62);border:1px solid #363b46;
    box-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:none;}
  #miniMap canvas{display:block;width:100%;height:100%;}
  /* the map screen pauses the world, so a minimap under it is frozen and
     meaningless -- and during attract the overlay above it is
     transparent. Same combinator, same reasoning, as #globalSearch's own
     rule further down. */
  #titleOverlay:not(.hidden) ~ #miniMap{display:none !important;}
  body.tdFailUp #miniMap, body.tdWinUp #miniMap,
  body.slFailUp #miniMap{display:none !important;}
  /* camera depth toggle (see ZOOM_K). Sits in the RIGHT RAIL, directly
     under #globalAvatar — every other edge is already spoken for:
     #globalAvatar top-right, #globalSearch top-left, #panelToggle
     top-centre, #gpsHud bottom-centre, #hjTap bottom-right in
     challenge. 38px wide to match .iconBtn so the rail reads as one
     column; squared corners rather than the rail's circles because
     this is a setting, not navigation. z-index 60 matches the rail so
     it clears .overlay (10) and #hjUI (6). */
  #zoomBtn{position:fixed;right:14px;
    top:calc(12px + env(safe-area-inset-top) + 46px);z-index:60;
    width:38px;height:38px;border-radius:11px;
    background:rgba(20,23,29,0.62);border:1px solid #363b46;
    box-shadow:0 2px 6px rgba(0,0,0,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    line-height:1.05;cursor:pointer;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;}
  #zoomBtn:active{opacity:0.6;}
  #zoomBtn .zCap{font-size:8px;letter-spacing:1px;color:#8f95a1;}
  #zoomBtn .zLvl{font-size:17px;font-weight:700;color:#e8eaef;}
  .hidden{display:none!important;}
  .big{font-size:42px;margin:2px 0;}
  /* ================= TIPSEY PROFILE — Trophy Case + Store + Side Missions
     (Phase A). Ported from profile-bench.html. All new selectors prefixed
     tp* to guarantee no collision with the rest of this file. ================= */
  /* FIXED, not absolute, and OUTSIDE #titleOverlay. See game/index.html
     for the full note: nested inside #screenWrap these panels inherited
     the map screen's display:none once a route started, so the always-on
     robot button opened a panel nobody could see. */
  /* SHEET OVER THE MAP, NOT A PAGE (Sir's call, 2026-08-26: "give it a
     sheet over the map -- i dont want the map to resize we are already
     having issues with that").

     Two constraints, and the second is why this is NOT the missions
     drawer. #tpMissionsPanel lives INSIDE #bottomSheet as a flex sibling
     of #mapCard, so raising it shrinks the map -- that coupling is what
     forced tpSheetReflow into existence and is the source of the resize
     trouble. This surface stays position:fixed and overlays instead, so
     #mapCard never changes size and nothing on this path needs to touch
     resizeRouteMap/drawRouteMap at all.

     The panel itself is now the SCRIM; #tpProfSheet is the thing that
     slides. Deliberately the same vocabulary as #tpDetailScrim /
     #tpDetailSheet further down -- rounded top, translateY(100%) at
     rest, opacity on the scrim -- so the game has one pop-out language
     rather than two. z-index stays 50, still under the detail scrim's
     55: opening a skin from the store grid has to land on top of the
     grid, and that ordering was already right.

     max-height, not inset:0. 82vh leaves a band of the map card
     visible above the sheet, which is the entire point -- at full
     height this is the old full-screen page with rounded corners. */
  /* GLASS, NOT CREAM (Sir's call, 2026-08-26: "lets have them more like
     glass i want the background behind the cards translucent"). The
     sheet surface is now a frosted pane the city reads through, and the
     scrim dropped from .5 to .28 to match -- at half opacity the map
     above the sheet was dimmed to mud and there was nothing worth
     seeing through the glass anyway.

     The rows and skin cards stay OPAQUE white on purpose. Frosting the
     surface is what makes it read as glass; frosting the content on top
     of it just makes small text sit on moving traffic. Translucent
     surface, solid cards.

     Both -webkit- and unprefixed backdrop-filter: iOS Safari still
     wants the prefix, and this panel ships to Devvit's webview too.
     Where backdrop-filter is unsupported the rgba background alone
     degrades to a flat wash rather than breaking -- legible, just not
     frosted. */
  /* NO PANE AT ALL (Sir, 2026-08-26: "can we make these even more
     transparent? i want the background invisible. i only want to see the
     buttons"). The glass above was one step; this is the end of that
     road. The scrim tint, the frosted fill, the highlight edge and the
     lift shadow all go -- what is left is a positioning shell that still
     slides up from the bottom and still caps itself at 82vh, carrying
     rows and cards that were always opaque in their own right.

     The transition and the .open opacity ramp stay: the sheet still
     needs somewhere to fade its CONTENTS from, and pointer-events:none
     at rest is what keeps a closed panel from eating taps on the map.

     backdrop-filter is gone rather than set to none -- there is nothing
     behind it to frost now, and on iOS an active backdrop-filter still
     promotes a compositing layer even at zero blur. This surface is over
     a live Phaser canvas, so a layer that does nothing is not free.

     Side missions reached this same conclusion first ("no chrome at all
     -- just the mission cards floating directly over the live map"); the
     store and trophy case now read the same way, which is the cohesion
     argument that moved the missions list into #bottomSheet running the
     other direction. */
  #tpProfilePanel{position:fixed;inset:0;z-index:50;background:transparent;
    display:flex;align-items:flex-end;opacity:0;pointer-events:none;
    transition:opacity .18s;}
  #tpProfilePanel.open{opacity:1;pointer-events:auto;}
  #tpProfSheet{width:100%;max-height:82vh;box-sizing:border-box;
    background:transparent;
    border-radius:20px 20px 0 0;overflow:hidden;
    display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .24s ease-out;}
  #tpProfilePanel.open #tpProfSheet{transform:translateY(0);}
  /* the sheet's grab band, matching #sheetGrab on the map's own bottom
     sheet. Decorative -- there is no drag gesture here, the scrim and
     the X are the exits -- but it is the cue that says "sheet" instead
     of "screen". */
  #tpProfGrab{flex:none;height:18px;display:flex;align-items:center;justify-content:center;}
  #tpProfGrab::after{content:"";width:40px;height:4px;border-radius:2px;background:#ddd6c4;}

  /* Side missions: no chrome at all (2026-08-11, Sir's call) — just the
     mission cards floating directly over the live map. No scrim, no
     sheet, no dedicated search box: the map already has its own search
     bar right above this panel, and a second one was a bug, not a
     feature. #tpMissionsPanel keeps its existing id/open-class contract
     (tpOpenMissions/tpCloseMissions/tpSyncGlobalBtns all just toggle
     .open on it, unchanged) but is fully transparent and starts below
     the map's own search bar so it's never covered. Tapping anywhere
     that isn't a card — including the visible map — closes it, and the
     map's own search icon is now a toggle (see tpMapSearchIcon.onclick)
     since there's no back button left to do it explicitly. */
  /* IT IS THE MAP'S OWN SHEET NOW (Sir's call, 2026-08-26): "the cards
     need to be collapsed into the bottom but can be brought up... the
     same bottom sheet as other bottom sheets in the game to keep
     everything cohesive."

     This used to be a fixed, full-height, transparent overlay of cards
     floating on top of the map -- its own surface, its own z-index, its
     own tap-anywhere-to-close rule, cohesive with nothing. #bottomSheet
     was already sitting under the map doing the job this wanted: same
     cream, same fold, already part of #screenWrap's flex column. So the
     list moved INTO it and this element is now just the drawer that
     sheet opens, which is why it keeps its id and its .open contract
     (tpOpenMissions/tpCloseMissions/tpSyncGlobalBtns are untouched) and
     loses everything else.

     .open now means EXPANDED, not mounted. Collapsed is the resting
     state and the sheet is always there -- so max-height, not opacity
     alone: the map above it is a flex sibling, so the drawer growing
     shrinks the map rather than covering it. That is the whole reason
     this reads like a map app and the old overlay did not. */
  /* text-align:left is not cosmetic here -- the drawer is inside
     #titleOverlay now, and .overlay sets text-align:center for the big
     DELIVERED/CRASHED headings. The old fixed panel sat outside that
     subtree and never inherited it; every row's name and description
     came out centred the moment it moved in. */
  #tpMissionsPanel{max-height:0;overflow:hidden;opacity:0;pointer-events:none;
    text-align:left;transition:max-height .22s ease-out,opacity .16s;}
  #tpMissionsPanel.open{max-height:52vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;opacity:1;pointer-events:auto;}
  /* the grab handle, and the only affordance that raises the drawer by
     touch. Its own row rather than a pseudo-element on the sheet so the
     tap target is a real 20px band, not a 4px pill. */
  #sheetGrab{flex:none;height:20px;margin:-4px 0 2px;display:flex;
    align-items:center;justify-content:center;}
  #sheetGrab::after{content:"";width:40px;height:4px;border-radius:2px;background:#ddd6c4;}
  #sheetGrab:active::after{background:#c9c0a8;}

  /* THE HEADER ROW IS GONE (Sir, 2026-08-26, circled on a screenshot:
     the X and the title). Both were saying something already on screen.
     #tpProfTitle read "TROPHY CASE" or "STORE" directly above a tab bar
     whose active pill reads exactly that in filled orange -- the label
     was a second, quieter copy of the answer. And the X duplicated an
     exit that already exists twice over: #tpProfilePanel closes on any
     tap outside the sheet, and the sheet caps at 82vh precisely so
     there is always a band of live map up there to tap.

     With the pane removed in the previous commit there was nothing left
     for the row to sit ON either -- an orange word and a dark circle
     floating over traffic, which is what the screenshot shows.

     The tab bar is now the sheet's first row after the grab band.
     #tpWalletPill was moved into the tab bar earlier and is unaffected.

     KEPT: body.tpPanelOpen still hides #globalSearch/#globalAvatar. That
     rule was written because those two landed on top of #tpProfBack and
     swallowed its taps, and #tpProfBack is what just went away -- but
     they would now sit on the cards instead, which is no better, so the
     rule stands on its own merits. */
  #tpWalletPill{flex:none;background:#fff;border:1px solid #ddd6c4;border-radius:20px;
    padding:6px 12px;display:flex;align-items:center;gap:6px;margin-left:auto;}
  #tpWalletPill .tpWVal{font-size:14px;font-weight:800;color:#b5540e;}

  #tpTabBar{flex:none;display:flex;background:transparent;padding:0 14px 12px;gap:8px;}
  .tpTabBtn{flex:1;background:#fff;border:1px solid #ddd6c4;color:#8f8571;border-radius:10px;
    padding:9px 4px;font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;}
  .tpTabBtn.tpActive{background:#ff7a1a;border-color:#ff7a1a;color:#fff;}
  .tpTabBtn:active{transform:scale(0.97);}

  #tpProfBody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));}

  /* scrolling and the safe-area fold both belong to the drawer and the
     sheet now (see #tpMissionsPanel.open and #bottomSheet), so this is
     down to plain padding. */
  #tpMissionsBody{padding:8px 0 2px;}
  .tpMedal.tpMission{background:#cfe0f5;}
  .tpMedal.tpComingSoon{background:#e4dfd0;}
  .tpMedal.tpCompleted{background:#d7f0dc;}

  /* ---- store grid ---- */
  #tpStoreGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tpSkinCard{background:#fff;border:2px solid #ddd6c4;border-radius:14px;padding:10px 10px 12px;
    display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;
    transition:box-shadow .3s;}
  .tpSkinCard:active{transform:scale(0.97);}
  .tpSkinCard.tpEquipped{border-color:#ff7a1a;background:#fff7ef;}
  /* DIM THE CONTENTS, NOT THE CARD. opacity on the element itself made
     the whole card translucent, which was fine over frosted glass and is
     not fine over a live city -- a locked skin would have traffic
     driving through its name. The children fade by exactly the same
     amount; the white surface underneath them stays solid. */
  .tpSkinCard.tpLocked{opacity:1;}
  .tpSkinCard.tpLocked > *{opacity:.62;}
  .tpSwatch{width:64px;height:64px;border-radius:12px;background:#f4f0e4;

  .tpPriceTag{background:#f5f1e6;border-radius:20px;padding:5px 0;font-size:12px;font-weight:800;color:#b5540e;}
  .tpPriceTag.tpShort{color:#a99f8a;}
  .tpEquipBadge{background:#ff7a1a;color:#fff;border-radius:20px;padding:5px 0;font-size:10.5px;

  .tpLockRow{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;

  /* ---- trophy / mission list (shared row style) ---- */
  .tpTrRow{background:#fff;border:1px solid #ddd6c4;border-radius:14px;padding:12px;
    display:flex;align-items:center;gap:12px;margin-bottom:10px;transition:box-shadow .3s;}
  .tpTrRow:active{transform:scale(0.98);}
  .tpTrRow.tpLocked{opacity:1;}
  .tpTrRow.tpLocked > *{opacity:.68;}   /* see .tpSkinCard.tpLocked above */
  .tpTrRow.tpUnclaimed{border-color:#ff7a1a;background:#fff7ef;}

  .tpMedal.silver{background:#dedee6;}

  .tpTrName{font-size:13.5px;font-weight:800;color:#2e3138;}
  .tpTrDesc{font-size:11px;color:#8f8571;margin-top:2px;line-height:1.35;}
  .tpTrProgWrap{margin-top:6px;height:5px;border-radius:3px;background:#ece6d4;overflow:hidden;}
  .tpTrProgFill{height:100%;background:#ff7a1a;border-radius:3px;}
  .tpTrReward{margin-top:5px;font-size:10.5px;font-weight:700;color:#b5540e;display:flex;align-items:center;gap:4px;}
  .tpCheckBadge{width:26px;height:26px;border-radius:50%;background:#e7f4e9;color:#2f8f4e;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;}
  .tpClaimDot{width:10px;height:10px;border-radius:50%;background:#ff7a1a;flex:none;
    box-shadow:0 0 0 3px rgba(255,122,26,.25);}

  /* ---- shared detail sheet ---- */
  #tpDetailScrim{position:fixed;inset:0;background:rgba(20,22,27,.5);z-index:55;
    display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .18s;}
  #tpDetailScrim.open{opacity:1;pointer-events:auto;}
  #tpDetailSheet{width:100%;background:#f0ece0;border-radius:20px 20px 0 0;
    padding:18px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .22s ease-out;}
  #tpDetailScrim.open #tpDetailSheet{transform:translateY(0);}
  #tpDetailClose{position:absolute;top:-14px;right:16px;width:30px;height:30px;border-radius:50%;
    background:#2e3138;color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .tpDetailSwatch{width:92px;height:92px;border-radius:16px;background:#fff;margin:0 auto 12px;
    display:flex;align-items:center;justify-content:center;border:1px solid #ddd6c4;font-size:38px;}
  #tpDetailName{text-align:center;font-size:18px;font-weight:800;color:#2e3138;margin-bottom:4px;}
  #tpDetailDesc{text-align:center;font-size:12.5px;color:#8f8571;line-height:1.5;margin-bottom:10px;}
  #tpDetailProgWrap{height:8px;border-radius:4px;background:#ece6d4;overflow:hidden;margin-bottom:6px;}
  #tpDetailProgFill{height:100%;background:#ff7a1a;border-radius:4px;transition:width .3s;}
  #tpDetailProgLabel{text-align:center;font-size:11px;color:#a99f8a;margin:0 0 14px;}
  #tpDetailAction{width:100%;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:800;letter-spacing:.3px;}
  #tpDetailAction.tpBuy,#tpDetailAction.tpClaim{background:#ff7a1a;color:#fff;box-shadow:0 3px 0 #b5540e;}
  #tpDetailAction.tpBuy:active,#tpDetailAction.tpClaim:active{transform:translateY(2px);box-shadow:0 1px 0 #b5540e;}
  #tpDetailAction.tpEquip{background:#2e3138;color:#fff;}
  #tpDetailAction.tpEquip:active{transform:scale(0.98);}
  #tpDetailAction.tpDone,#tpDetailAction.tpEquipped{background:#e7f4e9;color:#2f8f4e;}
  #tpDetailAction.tpLockedBtn{background:#e4dfd0;color:#8f8571;}
  #tpDetailAction.tpLink{background:#2e3138;color:#fff;}
  #tpDetailAction.tpLink:active{transform:scale(0.98);}
  #tpDetailNote{text-align:center;font-size:11px;color:#a99f8a;margin-top:10px;}

  #tpToast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#2e3138;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;
    opacity:0;transition:all .2s;pointer-events:none;z-index:58;max-width:88%;
    text-align:center;white-space:normal;}
  #tpToast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- DELIVERED RECEIPT (Sir's call, 2026-08-26) ----------
     "lets give the bottom card and it goes away after a few seconds."

     The daily's ending under free play. Deliberately NOT #winOverlay:
     an overlay is a screen, and the whole point of the new ending is
     that there is no screen -- the city is still running, the robot is
     already driveable, and this is a receipt sliding over a live game
     rather than a card you have to dismiss to get back to one.

     Same cream sheet as #winCard, same .sheetRow typography, so the
     numbers read identically to the card it replaces; the geometry is
     just inverted (fixed to the viewport, rounded on TOP, slides up
     from below) because it is anchored to the screen instead of to the
     bottom of an overlay. z-index 58 is #tpToast's -- the other thing
     in this file that talks over a live game -- and matches the same
     number tdStackIcons already reserves for over-overlay chrome.

     pointer-events auto, unlike the toast: a tap dismisses it early.
     Nothing else on it is interactive, and it sits in the bottom
     safe-area strip where the stick is not. */
  #tdReceipt{position:fixed;left:0;right:0;bottom:0;z-index:58;
    background:#f0ece0;color:#2e3138;border-radius:20px 20px 0 0;
    padding:12px 16px calc(10px + env(safe-area-inset-bottom));
    transform:translateY(115%);transition:transform .28s ease;
    pointer-events:auto;box-shadow:0 -4px 18px rgba(0,0,0,0.28);}
  #tdReceipt.show{transform:translateY(0);}
  #tdReceipt .sheetRow + .sheetRow{margin-top:3px;}
  #tdReceipt .sheetRow{display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;line-height:1.1;}
  #tdReceipt b{color:#b5540e;}
  #tdReceipt .tdrHead{text-align:center;font-size:12px;letter-spacing:1.4px;
    font-weight:800;color:#ff7a1a;text-transform:uppercase;margin-bottom:7px;}

  /* ---------- HYDRANT CHALLENGE overlay ---------- */
  .hjHidden{display:none !important;}
  #hjUI{position:absolute;left:0;right:0;bottom:0;top:0;pointer-events:none;z-index:6;}
  #hjUI.hidden{display:none;}
  #hjTitle{display:none;position:absolute;left:0;right:0;top:10px;text-align:center;font-size:13px;
    font-weight:700;letter-spacing:2px;color:#ffd15c;text-shadow:0 1px 3px rgba(0,0,0,.8);}
  #hjUnlock{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:20px;
    font-weight:800;letter-spacing:2px;color:#ffd15c;text-shadow:0 2px 6px rgba(0,0,0,.9);
    opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;}
  #hjUnlock small{display:block;font-size:10px;letter-spacing:1.5px;color:#fff;margin-top:6px;}
  #hjUnlock.show{opacity:1;transform:scale(1);}
  #hjMeterWrap{position:absolute;left:12px;right:12px;bottom:158px;}
  #hjMeter{position:relative;height:20px;border-radius:10px;background:#0f1116;
    border:1px solid #363b46;overflow:hidden;}
  #hjBand{position:absolute;top:0;bottom:0;background:rgba(96,222,120,.28);
    border-left:2px solid #4fd167;border-right:2px solid #4fd167;}
  #hjFill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ff7a1a;opacity:.9;}
  #hjFill.in{background:#4fd167;}
  #hjNeedle{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff;box-shadow:0 0 6px #fff;}
  #hjLbl{font-size:9px;letter-spacing:1.4px;color:#8f95a1;text-transform:uppercase;
    padding:4px 0 0;text-align:center;}
  #hjLbl.locked{color:#4fd167;}
  /* one word, circular — same shape language as GO and Retry */
  /* IDENTICAL to the GO button: 88px, 56px off the bottom, 19px text and
     the same #b5540e shadow. TAP, RETRY and GO are one control in three
     places, so they must not drift apart. */
  #hjTap,#hjTapL,#hjTapR{position:absolute;bottom:56px;
    width:88px;height:88px;border-radius:50%;padding:0;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:700;letter-spacing:1px;
    background:#ff7a1a;border:none;color:#fff;
    box-shadow:0 4px 0 #b5540e;pointer-events:auto;touch-action:none;}
  /* three fingers rolling side by side, same shape language as the
     original single TAP — center one unchanged, two more flank it so
     mobile can roll taps the way A/S/D lets a keyboard roll them */
  #hjTap{left:50%;transform:translateX(-50%);}
  #hjTapL{left:calc(50% - 100px);transform:translateX(-50%);}
  #hjTapR{left:calc(50% + 100px);transform:translateX(-50%);}
  #hjTap:active,#hjTapL:active,#hjTapR:active{transform:translateX(-50%) translateY(3px);box-shadow:0 1px 0 #b5540e;}
  /* the running commentary under the meter is gone — the band itself
     already says everything it was saying */
  #hjLbl{display:none;}
  #hjTap.dead,#hjTapL.dead,#hjTapR.dead{background:#3a3f4a;box-shadow:0 4px 0 #23262d;color:#6d7380;}
  /* the same orange robot button the map screen uses, in the same place —
     one control for "back to the menu" wherever you are */
  /* #hjQuit is gone. It was a SECOND orange robot at the top of the
     challenge screen while the always-on one sat lower down — two
     identical buttons doing different things. The global one exits the
     challenge as part of opening the profile, so this was redundant. */
  /* ONE robot button, always on screen. It used to exist three times —
     on the map, on the fail overlay and in the challenge — each appearing
     and disappearing with its own layer, so it kept vanishing exactly
     when you wanted it. This one lives outside every overlay and is
     never hidden. */
  /* The profile / missions / detail panels were z-index 8, BELOW the
     title and fail overlays at 10. Chromium happened to paint them on
     top through DOM order, but that is luck, not layering — on another
     engine the panel opens and you simply never see it, which reads as
     the button doing nothing. Lifted above the overlays, still below the
     always-on robot. */
  /* BELOW the day-selector strip. #panel is a full-width 56px bar
     (ROUTE / TODAY / RANDOM DAY), so anything at top-right lands on top
     of RANDOM DAY — they overlapped by 41px and the tap went to whichever
     the engine happened to favour, which is why this button "did
     nothing" on device and worked in headless. Sitting under the strip
     means it can never fight it. */
  #globalAvatar{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;
    z-index:60;background:#ff7a1a;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.35);}
  #globalAvatar:active{transform:scale(0.94);}
  /* Same treatment for the magnifying glass — it lived inside #mapCard
     -> #screenWrap -> #titleOverlay and vanished the instant a route
     started. See game/index.html for the full note. */
  /* ---------- boot loader ----------
     The title screen used to paint before the route existed: brand, GO
     button, "Ready for pickup", and an empty map card carrying a literal
     "…" placeholder — for as long as the route build took, plus a Redis
     round trip on Devvit. That is the flash of "the game without the
     map". This covers the gap.

     It is markup, not JS-injected, and it is visible by DEFAULT with no
     .hidden class, so the very first paint the browser does is already
     the spinner. Anything created in script runs a frame too late and
     the flash survives — which is the whole bug.

     z-index 200 puts it over #globalAvatar and #globalSearch at 60, so
     the two always-on buttons do not sit on top of the loader. */
  /* TWO JOBS, SPLIT (2026-08-27). This element was doing both of them
     and only one of them can be got wrong.

     COVERING THE SCREEN is the entire reason the loader is static
     markup that paints on frame one, and inset:0 does that correctly at
     any viewport size the browser cares to report -- a box that is too
     big still covers everything. So the background keeps inset:0 and is
     unchanged.

     BEING CENTRED is the part that needs a correct number, and it was
     getting it from the same box. On a standalone launch that box is
     the unsettled layout viewport, so the column centred in something
     larger than the screen and sat low and right until the real size
     arrived. #blInner is anchored to the MEASURED visual viewport
     instead (--vvl/--vvt/--vvw/--vvh, published by the head script
     above), so it is centred on what is actually visible rather than on
     what the layout viewport currently believes.

     The fallbacks are 100vw/100vh, i.e. exactly today's behaviour, so
     if visualViewport is unavailable this is a no-op rather than a
     regression.

     opacity on this element makes a stacking context but NOT a
     containing block for fixed descendants (only transform/filter/
     perspective/will-change/contain do), so #blInner stays anchored to
     the viewport and still fades out with the parent on .done. */
  #bootLoader{position:fixed;inset:0;z-index:200;
    background:#14161a;transition:opacity .28s ease;}
  #bootLoader.done{opacity:0;pointer-events:none;}
  #blInner{position:fixed;
    left:calc(var(--vvl, 0px) + var(--vvw, 100vw) / 2);
    top:calc(var(--vvt, 0px) + var(--vvh, 100vh) / 2);
    transform:translate(-50%, -50%);
    display:flex;flex-direction:column;align-items:center;gap:10px;}
  /* FLAT 2D FLIP, NOT FAKE VOLUME (2026-08-11, Sir's call: "nothing in
     the game is 3D, it has to be 2D" -- reverts the 2026-08-10 rotateY
     rig). See game/index.html for the full note. */
  #blRobotStage{position:relative;width:88px;height:101px;}
  #blRobotCard{position:absolute;inset:0;
    animation:blFlip 1.35s cubic-bezier(.45,.05,.55,.95) infinite;}
  .blFace{position:absolute;inset:0;
    animation:blFaceFront 1.35s steps(1) infinite;}
  .blBack{transform:scaleX(-1);
    animation-name:blFaceBack;}
  @keyframes blFlip{0%{transform:scaleX(1);}
                     50%{transform:scaleX(-1);}
                     100%{transform:scaleX(1);}}
  /* hard cuts, not fades -- see game/index.html for why. Windows match
     blFlip's own zero-crossings (roughly 25%/75%), with a hair of
     margin on each side so the swap always lands on a thin sliver. */
  @keyframes blFaceFront{0%,23%{opacity:1;} 27%,73%{opacity:0;} 77%,100%{opacity:1;}}
  @keyframes blFaceBack{0%,23%{opacity:0;} 27%,73%{opacity:1;} 77%,100%{opacity:0;}}
  /* the shadow is widest face-on and narrowest edge-on, i.e. twice per
     turn, which is what sells the rotation as depth rather than a flip */
  #blShadow{width:52px;height:9px;border-radius:50%;background:#000;
    animation:blShad 1.35s cubic-bezier(.45,.05,.55,.95) infinite;}
  @keyframes blShad{0%,50%,100%{transform:scaleX(1);opacity:.42;}
                     25%,75%{transform:scaleX(.46);opacity:.22;}}
  #blText{margin-top:6px;font:700 12px/1 system-ui,-apple-system,sans-serif;
    letter-spacing:2.5px;text-transform:uppercase;color:#ff7a1a;opacity:.85;}
  /* the probe's readout. Rides inside the loader because the loader is
     already the thing on screen during the window being measured, so
     this needs no new overlay and cannot itself perturb the layout it
     is reporting on -- position:absolute, out of the flex column, so
     adding it does not move the robot by a single pixel. Empty and
     zero-size unless ?vpdiag=1 fills it. */
  #blDiag{position:absolute;left:8px;top:8px;right:8px;white-space:pre;
    font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#7fe3ff;opacity:.9;pointer-events:none;text-align:left;}
  #globalSearch{position:fixed;top:calc(12px + env(safe-area-inset-top));left:14px;
    z-index:60;background:rgba(255,255,255,.92);cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.35);}
  #globalSearch:active{transform:scale(0.94);}
  /* globalSearch is fixed and "never hidden" by design so it survives
     mid-route -- but with no tie to titleOverlay it also rendered on the
     map/job screen, landing on top of tpMapSearchWrap's own search pill.
     See game/index.html for the full note. */
  #titleOverlay:not(.hidden) ~ #globalSearch{display:none !important;}
  /* the per-screen copies are retired in favour of the two global ones.
     #winMenuBtn was part of this set and got missed — it was still being
     shown on Devvit, at left:14px, directly under #globalSearch. It is
     deleted outright rather than listed here, since unlike the others it
     had no non-Devvit caller keeping it alive. */
  #avatarIcon,#failAvatarBtn,#searchIcon,#failMenuBtn{display:none !important;}
  /* ...and the global pair steps aside while a panel is up: both sit at
     z-index 60 in the corner Profile's header uses for its back button,
     so #globalSearch was swallowing every tap on #tpProfBack. Side
     Missions no longer has a back button to protect (cards float
     directly over the map now), but hiding these while it's open too
     is harmless. */
  body.tpPanelOpen #globalAvatar, body.tpPanelOpen #globalSearch,
  body.tpPanelOpen #zoomBtn, body.tpPanelOpen #miniMap{display:none !important;}
  /* #tpMapSearch is injected as a string by tpMapExplore, so its inline
     style cannot reach ::placeholder -- that pseudo needs a real rule.
     Lives here for exactly that one reason; everything else about the
     field is inline next to the rest of the map chrome. */
  #tpMapSearch::placeholder{color:#6b6f78;opacity:1;}
</style>
</head>
<body>
<div id="wrap">

  </div>
  <div id="game"></div>
  <div id="gpsHud" class="hidden"><svg id="gpsChev" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,3 20,20 12,15.5 4,20"/></svg><span id="gpsText"></span></div>

    <button id="hjTap">TAP</button>
    <button id="hjTapR">TAP</button>

</div>

<div id="titleOverlay" class="overlay">

      <canvas id="routeMap" width="280" height="476"></canvas>
      <div class="brand">TIPSEY</div>
      <button class="iconBtn" id="searchIcon"></button>
      <div class="iconBtn" id="avatarIcon">
        <svg viewBox="0 0 40 46" width="23" height="27">
          <line x1="13" y1="5" x2="13" y2="11" stroke="#2e3138" stroke-width="1.5"/>
          <circle cx="13" cy="5" r="2" fill="#ff5722"/>
          <rect x="9" y="11" width="22" height="7" fill="#f7f8fa" stroke="#30343d" stroke-width="1.2"/>
          <rect x="5" y="18" width="30" height="21" fill="#f7f8fa" stroke="#30343d" stroke-width="1.2"/>
          <rect x="9" y="22" width="22" height="8" fill="#22242b"/>
          <circle cx="16" cy="26" r="1.9" fill="#7fe3ff"/>
          <circle cx="24" cy="26" r="1.9" fill="#7fe3ff"/>

        </svg>
      </div>

    </div>

        <span class="status" id="sheetStatus">Ready for pickup</span>

          <div id="tpMissionsList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

  <!-- ===== Tipsey Profile: Trophy Case + Store (Phase A) ===== -->
  <div id="tpProfilePanel">
    <div id="tpProfSheet">
      <div id="tpProfGrab"></div>

        <div id="tpWalletPill"><span class="tpWVal" id="tpWalletVal">$0.00</span></div>
      </div>
      <div id="tpProfBody">
        <div id="tpTrList"></div>
        <div id="tpStoreGrid" style="display:none;"></div>
      </div>
    </div>
  </div>

  <!-- ===== Tipsey Profile: shared detail sheet ===== -->
  <div id="tpDetailScrim">
    <div id="tpDetailSheet">
      <button id="tpDetailClose"></button>
      <div class="tpDetailSwatch" id="tpDetailSwatch"></div>
      <div id="tpDetailName">—</div>
      <div id="tpDetailDesc">—</div>
      <div id="tpDetailProgWrap" style="display:none;"><div id="tpDetailProgFill"></div></div>
      <div id="tpDetailProgLabel"></div>
      <button id="tpDetailAction">—</button>
      <div id="tpDetailNote"></div>
    </div>
  </div>

  <div id="tpToast"></div>
  <div id="tdReceipt"></div>

<button class="iconBtn" id="globalAvatar" aria-label="Profile"><svg viewBox="0 0 40 46" width="23" height="27">
      <line x1="13" y1="5" x2="13" y2="11" stroke="#2e3138" stroke-width="1.5"/>
      <circle cx="13" cy="5" r="2" fill="#ff5722"/>
      <rect x="9" y="11" width="22" height="7" fill="#f7f8fa" stroke="#30343d" stroke-width="1.2"/>
      <rect x="5" y="18" width="30" height="21" fill="#f7f8fa" stroke="#30343d" stroke-width="1.2"/>
      <rect x="9" y="22" width="22" height="8" fill="#22242b"/>
      <circle cx="16" cy="26" r="1.9" fill="#7fe3ff"/>
      <circle cx="24" cy="26" r="1.9" fill="#7fe3ff"/>
      <rect x="5" y="32" width="30" height="4" fill="#c2452e"/>
      <rect x="5" y="34" width="30" height="3" fill="#ffcc33" stroke="#c9a020" stroke-width="0.5"/>
      <rect x="5" y="36" width="30" height="3" fill="#494e58"/>
    </svg></button>
<button class="iconBtn" id="globalSearch" aria-label="Side missions"></button>
<!-- AFTER #titleOverlay ON PURPOSE (2026-08-27). The minimap is hidden by
     tpMiniDraw, which only runs from drawHUD -- and drawHUD stops running
     the moment the map screen pauses the world, so the toggle never fires
     and a stale minimap is left sitting there. #titleOverlay's z-index
     covers it in the ordinary case, but body.attract makes that overlay
     transparent. The CSS sibling rule below is the real guard, and a `~`
     combinator only reaches FOLLOWING siblings -- which is the whole
     reason this lives down here next to #globalSearch, which is hidden by
     the identical rule for the identical reason, rather than up beside
     #gpsHud where it visually belongs. -->
<div id="miniMap" class="hidden"><canvas id="miniMapC"></canvas></div>
<div id="bootLoader">
 <div id="blInner">
  <div id="blRobotStage">
   <div id="blRobotCard">

      <rect x="5" y="18" width="30" height="21" fill="#f7f8fa" stroke="#30343d" stroke-width="1.2"/>
      <rect x="9" y="22" width="22" height="8" fill="#22242b"/>
      <circle cx="16" cy="26" r="1.9" fill="#7fe3ff"/>
      <circle cx="24" cy="26" r="1.9" fill="#7fe3ff"/>
      <rect x="5" y="32" width="30" height="4" fill="#c2452e"/>
      <rect x="5" y="34" width="30" height="3" fill="#ffcc33" stroke="#c9a020" stroke-width="0.5"/>
      <rect x="5" y="36" width="30" height="3" fill="#494e58"/>
    </svg>
    <svg id="blRobotBack" class="blFace blBack" viewBox="0 0 40 46" width="88" height="101" aria-hidden="true">
      <line x1="13" y1="5" x2="13" y2="11" stroke="#2e3138" stroke-width="1.5"/>
      <circle cx="13" cy="5" r="2" fill="#7a2e1a"/>
      <rect x="9" y="11" width="22" height="7" fill="#dcdde1" stroke="#30343d" stroke-width="1.2"/>
      <rect x="5" y="18" width="30" height="21" fill="#dcdde1" stroke="#30343d" stroke-width="1.2"/>
      <rect x="9" y="22" width="22" height="8" fill="#3a3e46"/>
      <rect x="13" y="24" width="2" height="4" fill="#22242b"/>
      <rect x="21" y="24" width="2" height="4" fill="#22242b"/>
      <rect x="5" y="32" width="30" height="4" fill="#c2452e"/>
      <rect x="5" y="34" width="30" height="3" fill="#ffcc33" stroke="#c9a020" stroke-width="0.5"/>
      <rect x="5" y="36" width="30" height="3" fill="#494e58"/>
    </svg>
   </div>
  </div>
  <div id="blShadow"></div>
  <div id="blText">Plotting route</div>
 </div>
 <div id="blDiag"></div>
</div>

<div id="failOverlay" class="overlay hidden">
  <button class="iconBtn menuBtn" id="failMenuBtn"></button>
  <div class="iconBtn failAvatar" id="failAvatarBtn"><svg viewBox="0 0 40 46" width="23" height="27">
      <line x1="13" y1="5" x2="13" y2="11" stroke="#2e3138" stroke-width="1.5"/>
      <circle cx="13" cy="5" r="2" fill="#ff5722"/>
      <rect x="9" y="11" width="22" height="7" fill="#f7f8fa" stroke="#30343d" stroke-width="1.2"/>
      <rect x="5" y="18" width="30" height="21" fill="#f7f8fa" stroke="#30343d" stroke-width="1.2"/>
      <rect x="9" y="22" width="22" height="8" fill="#22242b"/>
      <circle cx="16" cy="26" r="1.9" fill="#7fe3ff"/>
      <circle cx="24" cy="26" r="1.9" fill="#7fe3ff"/>
      <rect x="5" y="32" width="30" height="4" fill="#c2452e"/>
      <rect x="5" y="34" width="30" height="3" fill="#ffcc33" stroke="#c9a020" stroke-width="0.5"/>
      <rect x="5" y="36" width="30" height="3" fill="#494e58"/>
    </svg></div>

</div>
