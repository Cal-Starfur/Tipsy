const GROUPS = [

/* ---------- night hues to audition ---------- */
const HUES = [
  { n:"NAVY",   c:0x5a6aa8 },

  { n:"TEAL",   c:0x54808f },

];

const W = 940, H = 1210, SCENE_H = 190;
let night = true, split = false, glow = true, hueIdx = 0, depth = 0.55, palIdx = 2;

function lerpToWhite(c, d){
  /* the MULTIPLY color: white = day, full hue = deepest night */
  const r = (c>>16)&255, g2 = (c>>8)&255, b = c&255;
  const R = Math.round(255 + (r-255)*d), G = Math.round(255 + (g2-255)*d), B = Math.round(255 + (b-255)*d);
  return (R<<16)|(G<<8)|B;
}

class NightLab extends Phaser.Scene {
  constructor(){ super("nightlab"); }
  create(){
    this.board = this.add.graphics();     // day-lit content
    this.tint = this.add.graphics();      // MULTIPLY night rect
    this.tint.setBlendMode(Phaser.BlendModes.MULTIPLY);
    this.glowG = this.add.graphics();     // ADD accents ABOVE the tint
    this.glowG.setBlendMode(Phaser.BlendModes.ADD);
    this.labels = [];
    this.redraw();
    this.updateVals();
  }

  clearLabels(){ for(const l of this.labels) l.destroy(); this.labels = []; }
  label(x, y, txt, size=10, color="#8f95a1"){
    this.labels.push(this.add.text(x, y, txt, { fontSize: size+"px", color, fontFamily:"monospace" }));
  }

  redraw(){
    const g = this.board; g.clear(); this.clearLabels();
    g.fillStyle(0x14161a, 1); g.fillRect(0, 0, W, H);
    this.drawScene(g);
    this.drawBoard(g);
    this.drawTint();
    this.drawGlow();
  }

  /* ---------- mini scene strip: pal ground + house + props ---------- */
  drawScene(g){
    const pal = ROUTE_PALS[palIdx];
    const y0 = 26;
    this.label(8, 6, "SCENE — route pal: " + pal.n + "  (PAL button cycles)", 12, "#e8eaef");
    // sky
    g.fillStyle(pal.sky, 1); g.fillRect(0, y0, W, 52);
    // house block
    const hp = HOUSE_WRAP_PALETTES[3], sp = STORE_PALETTES[1];
    g.fillStyle(hp.roof, 1); g.fillRect(60, y0+18, 190, 12);
    g.fillStyle(hp.wall, 1); g.fillRect(66, y0+30, 178, 58);
    g.fillStyle(hp.wallDk, 1); g.fillRect(66, y0+30, 178, 6);
    this.sceneWindows = [];
    for(let i=0;i<4;i++){
      const wx = 80 + i*42;
      this.sceneWindows.push({x:wx, y:y0+46, w:22, h:26});
      g.fillStyle(0x262b33, 1); g.fillRect(wx, y0+46, 22, 26);
      g.fillStyle(hp.trim, 1); g.fillRect(wx-2, y0+44, 26, 2);
    }
    // store
    g.fillStyle(sp.wall, 1); g.fillRect(300, y0+26, 170, 62);
    g.fillStyle(sp.trim, 1); g.fillRect(300, y0+26, 170, 8);
    g.fillStyle(sp.sign, 1); g.fillRect(330, y0+32, 110, 12);
    this.sceneWindows.push({x:316, y:y0+52, w:60, h:30});
    this.sceneWindows.push({x:396, y:y0+52, w:60, h:30});
    g.fillStyle(0x262b33, 1); g.fillRect(316, y0+52, 60, 30); g.fillRect(396, y0+52, 60, 30);
    // palm
    g.fillStyle(PALM.trunk, 1); g.fillRect(510, y0+34, 8, 54);
    g.fillStyle(PALM.frondA, 1); g.fillCircle(514, y0+30, 20);
    g.fillStyle(PALM.frondB, 1); g.fillCircle(506, y0+36, 12);
    // streetlight pole (glow pool comes from glow pass)
    this.lampX = 590; this.lampY = y0+88;
    g.fillStyle(0x3a3d43, 1); g.fillRect(this.lampX-2, y0+30, 4, 58);
    g.fillRect(this.lampX-2, y0+30, 18, 3);
    // sidewalk
    g.fillStyle(pal.pave, 1); g.fillRect(0, y0+88, W, 34);
    g.fillStyle(pal.paveB, 1);
    for(let x=0; x<W; x+=44) g.fillRect(x, y0+88, 22, 34);
    g.fillStyle(pal.paveEdge, 1); g.fillRect(0, y0+120, W, 3);
    // props on the walk: cone, hydrant, bin, Tipsy, kicker blob
    g.fillStyle(CONE.body, 1); g.fillTriangle(650, y0+116, 662, y0+116, 656, y0+92);
    g.fillStyle(HYD.cap, 1); g.fillRect(690, y0+98, 10, 18); g.fillCircle(695, y0+98, 6);
    g.fillStyle(BIN.body, 1); g.fillRect(724, y0+92, 16, 24);
    g.fillStyle(BIN.lid, 1); g.fillRect(722, y0+88, 20, 6);
    // Tipsy
    g.fillStyle(SKIN.bodyRight, 1); g.fillRect(780, y0+88, 30, 26);
    g.fillStyle(SKIN.stripe, 1); g.fillRect(780, y0+104, 30, 5);
    g.fillStyle(SKIN.visor, 1); g.fillRect(784, y0+92, 22, 7);
    g.fillStyle(SKIN.eye, 1); g.fillRect(787, y0+94, 4, 3); g.fillRect(799, y0+94, 4, 3);
    this.tipsyEyes = [{x:787,y:y0+94},{x:799,y:y0+94}];
    // kicker
    const kf = KICKER_FITS[0];
    g.fillStyle(KICKER_SKIN.c, 1); g.fillRect(846, y0+86, 10, 10);
    g.fillStyle(kf.hat.c, 1); g.fillRect(842, y0+84, 18, 4);
    g.fillStyle(kf.c, 1); g.fillRect(844, y0+96, 14, 12);
    g.fillStyle(KICKER_SKIN.c, 1); g.fillRect(846, y0+108, 3, 8); g.fillRect(853, y0+108, 3, 8);
    // road + car
    g.fillStyle(pal.road, 1); g.fillRect(0, y0+123, W, 42);
    g.fillStyle(pal.roadLine, 1);
    for(let x=8; x<W; x+=64) g.fillRect(x, y0+142, 30, 3);
    const cc = CAR_COLORS[1];
    g.fillStyle(cc.body, 1); g.fillRect(120, y0+130, 64, 20);
    g.fillStyle(cc.roof, 1); g.fillRect(134, y0+126, 34, 8);
    g.fillStyle(SCOOT.wheel, 1); g.fillCircle(132, y0+150, 6); g.fillCircle(172, y0+150, 6);
    this.carFront = {x:184, y:y0+140};

  /* ---------- swatch board ---------- */
  drawBoard(g){
    const SW = 30, SH = 26, GAP = 3, X0 = 8;
    let y = SCENE_H + 38;
    for(const grp of GROUPS){
      this.label(X0, y - 14, grp.name, 11, "#b5bac4");
      let x = X0;
      for(const it of grp.items){
        if(x + SW > W - 8){ x = X0; y += SH + GAP + 12; }
        if(it.dk !== undefined){
          g.fillStyle(it.c, 1);  g.fillRect(x, y, SW, SH*0.62);
          g.fillStyle(it.dk, 1); g.fillRect(x, y + SH*0.62, SW, SH*0.38);
        } else {
          g.fillStyle(it.c, 1);  g.fillRect(x, y, SW, SH);
        }
        this.label(x, y + SH + 1, it.n, 8, "#6b7078");
        x += SW + GAP;
      }
      y += SH + GAP + 26;
    }
    this.boardBottom = y;
  }

  /* ---------- THE NIGHT: one MULTIPLY rect ---------- */
  drawTint(){
    const g = this.tint; g.clear();
    if(!night) return;
    const mc = lerpToWhite(HUES[hueIdx].c, depth);
    const x0 = split ? W*0.42 : 0;
    g.fillStyle(mc, 1);
    g.fillRect(x0, 0, W - x0, H);
    if(split){
      g.setBlendMode(Phaser.BlendModes.NORMAL);
      /* thin divider so the eye knows where day ends — drawn in the
         same graphics but normal blend, then restore */
      g.lineStyle(2, 0xffffff, 0.5); g.lineBetween(x0, 0, x0, H);
      g.setBlendMode(Phaser.BlendModes.MULTIPLY);
    }
  }

  /* ---------- warm accents ABOVE the tint (ADD) ---------- */
  drawGlow(){
    const g = this.glowG; g.clear();
    if(!night || !glow) return;
    const inNight = x => !split || x > W*0.42;
    // lit windows
    for(const w of (this.sceneWindows || [])){
      if(!inNight(w.x)) continue;
      g.fillStyle(0xffc46a, 0.55); g.fillRect(w.x, w.y, w.w, w.h);
      g.fillStyle(0xffc46a, 0.10); g.fillRect(w.x-5, w.y-5, w.w+10, w.h+10);
    }
    // streetlight pool
    if(inNight(this.lampX)){
      g.fillStyle(0xffe0a0, 0.20); g.fillTriangle(this.lampX+14, SCENE_H-158+30, this.lampX-22, this.lampY+34, this.lampX+50, this.lampY+34);
      g.fillStyle(0xffe0a0, 0.16); g.fillEllipse(this.lampX+14, this.lampY+32, 84, 20);
      g.fillStyle(0xffe0a0, 0.9); g.fillRect(this.lampX+10, 52, 8, 4);
    }
    // headlights
    if(this.carFront && inNight(this.carFront.x)){
      g.fillStyle(0xfff3b0, 0.85); g.fillRect(this.carFront.x-3, this.carFront.y-6, 3, 4);
      g.fillStyle(0xfff3b0, 0.16); g.fillTriangle(this.carFront.x, this.carFront.y-4, this.carFront.x+52, this.carFront.y-12, this.carFront.x+52, this.carFront.y+6);
    }
    // Tipsy's eyes stay lit
    for(const e of (this.tipsyEyes || [])){
      if(!inNight(e.x)) continue;
      g.fillStyle(0x7fe3ff, 0.8); g.fillRect(e.x, e.y, 4, 3);
      g.fillStyle(0x7fe3ff, 0.14); g.fillRect(e.x-3, e.y-3, 10, 9);
    }
  }

  updateVals(){
    const mc = lerpToWhite(HUES[hueIdx].c, depth);
    document.getElementById("vals").textContent =
      `night ${night ? "ON" : "off"} · hue ${HUES[hueIdx].n} · depth ${depth.toFixed(2)} · multiply #${mc.toString(16).padStart(6,"0")}\n` +
      `glow ${glow ? "ON" : "off"} · split ${split ? "ON" : "off"} · scene pal ${ROUTE_PALS[palIdx].n}\n` +
      `port plan: ONE multiply rect over the world canvases · glows ADD-blended above it`;
  }
}

const game = new Phaser.Game({
  type: Phaser.AUTO, parent: "game", width: W, height: H,
  backgroundColor: "#14161a",
  scale: { mode: Phaser.Scale.WIDTH_CONTROLS_HEIGHT },
  scene: [NightLab]
});
const scn = () => game.scene.getScene("nightlab");
const btn = (id, fn) => document.getElementById(id).addEventListener("click", () => { fn(); const s = scn(); s.redraw(); s.updateVals(); });
btn("nightBtn", () => { night = !night; document.getElementById("nightBtn").classList.toggle("on", night); });
btn("splitBtn", () => { split = !split; document.getElementById("splitBtn").classList.toggle("on", split); });
btn("hueBtn",   () => { hueIdx = (hueIdx + 1) % HUES.length; });
btn("dDown",    () => { depth = Math.max(0.15, +(depth - 0.05).toFixed(2)); });
btn("dUp",      () => { depth = Math.min(0.9,  +(depth + 0.05).toFixed(2)); });
btn("glowBtn",  () => { glow = !glow; document.getElementById("glowBtn").classList.toggle("on", glow); });
btn("palBtn",   () => { palIdx = (palIdx + 1) % ROUTE_PALS.length; });
</script>
</body>
</html>
