<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Tipsy — shopfront lab</title>
<style>
  :root{ --bg:#14161a; --panel:#1d2026; --line:#2c313a; --ink:#e8e6e1; --mut:#8d939e; --hot:#ff7a1a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow-x:hidden}
  header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
  #stage{width:100%;display:block;background:linear-gradient(#1b1f26,#0f1114)}
  .bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
       background:var(--panel);position:sticky;top:0;z-index:5}
  button{background:#262b33;color:var(--ink);border:1px solid var(--line);border-radius:9px;
         padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer;min-width:52px}
  button:active{background:#333a45}
  button.on{background:var(--hot);border-color:var(--hot);color:#151515}
  .name{flex:1;text-align:center;font-size:17px;font-weight:700;letter-spacing:.01em}
  .idx{color:var(--mut);font-size:13px;font-weight:500}
  .meta{padding:14px 16px 26px;max-width:720px}
  .meta h2{font-size:15px;margin:0 0 6px;color:var(--hot);letter-spacing:.04em;text-transform:uppercase}
  .meta p{margin:0 0 10px;color:#c9cdd4;font-size:14.5px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .tag{background:#232830;border:1px solid var(--line);border-radius:20px;padding:5px 11px;
       font-size:12px;color:var(--mut)}
  .row{display:flex;gap:8px;padding:0 14px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .row button{flex:1;min-width:0;font-size:13px;padding:10px 6px}
</style>

<header><h1>Shopfront lab · one shop at a time</h1></header>
<div class="bar">
  <button id="prev">‹</button>
  <div class="name"><span id="nm">—</span><br><span class="idx" id="ix"></span></div>
  <button id="next">›</button>
</div>
<div class="row">
  <button id="tRoof" class="on">Roof kit</button>
  <button id="tProps" class="on">Kerb props</button>
  <button id="tPal">Palette</button>
  <button id="tGrid">Guides</button>
</div>
<canvas id="stage"></canvas>
<div class="meta">
  <h2 id="mh">—</h2>
  <p id="md"></p>
  <div class="tags" id="mt"></div>
</div>

<script src="shopfront-kit.js"></script>
<script src="shopfront-shops.js"></script>
<script>
/* ---------------------------------------------------------------
   Same isometric projection the game uses:
     sx = (x - y) * K
     sy = ((x + y) * 0.5 - z) * K
   Unit-local coords: a runs along the frontage, b runs 0 at the
   frontage to -D into the block, z is height. Front face is b = 0.
   --------------------------------------------------------------- */
const SCREEN = document.getElementById('stage');
let cv = SCREEN, ctx = cv.getContext('2d');
let K = 1, OX = 0, OY = 0;

/* ---- GAME SCALE ANCHORS ----
   Measured against the shipped drawStoreUnit rather than chosen. D was
   already exactly STORE_DEPTH (T2*3 = 276), but the lab's heights were
   not: shops were hand-set around H = 160-170 while a real store wall
   runs 238-266, so the lab has been drawing at roughly 0.65 of game
   scale vertically. The consequence is not cosmetic -- DOOR_H*0.88 =
   161.9 is the real shopfront door, which is TALLER than the whole
   168-unit bakery wall was, so the pickup worker who walks out of it
   would not have fitted through the opening.

   These are the game's own numbers. Height stacks build off DOOR_H the
   way drawStoreUnit does, so a shop comes out human-scaled by
   construction instead of by eye. */
const state = { i:0, roof:true, props:true, pal:0, grid:false };
const LAB_ZS = 1.5;
let ZSCALE = LAB_ZS;
function P(a,b,z){ return { x:(a-b)*K + OX, y:((a+b)*0.5 - z*ZSCALE)*K + OY }; }

/* this bench has one view and it is the one the library was composed
   against, where the a = w end of a unit is the visible one. The phaser
   bench sets this per edge from drawStoreUnit's own showRight test. */
const FLANK_RIGHT = true;

/* ---- THE KIT AND THE 81 SHOPS NOW LIVE IN THEIR OWN FILES ----
     shopfront-kit.js     every primitive a shop body calls
     shopfront-shops.js   the 81 bodies themselves
   Both are loaded by the script tags above this one. What stays here is
   the only thing this bench does not share with shopfront-phaser.html:
   its projection (P, K, OX, OY, ZSCALE), its framing pass, and its
   chrome. That single seam is the whole point -- see the header of
   shopfront-kit.js. */
/* ---- THE 81 SHOPS LIVE IN shopfront-shops.js ----
   Moved out so the phaser bench can run the identical bodies rather
   than a second copy of them. Loaded by the script tag above this one,
   so SHOPS is already bound by the time anything here runs. The host
   contract this file has to satisfy is documented at the top of that
   file: every primitive a shop body calls is defined in this script. */
/* ---------------- ground, framing, chrome ---------------- */
function pavement(){
  const g0=-90, g1=W+90, b0=110, b1=-D-70;
  T(g0,g1,b1,b0,0,'#cfc9b8');
  ctx.strokeStyle='#bdb7a6'; ctx.lineWidth=1;
  for(let a=g0;a<=g1;a+=46){ const s=P(a,b0,0), e=P(a,b1,0);
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(e.x,e.y); ctx.stroke(); }
  for(let b=b1;b<=b0;b+=46){ const s=P(g0,b,0), e=P(g1,b,0);
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(e.x,e.y); ctx.stroke(); }
  T(g0,g1,150,110,0,'#585c63');                            // road strip
}
function guides(){
  ctx.strokeStyle='rgba(255,122,26,.85)'; ctx.lineWidth=1.5; ctx.setLineDash([6,5]);
  poly([P(0,0,0),P(W,0,0),P(W,-D,0),P(0,-D,0)], null,'rgba(255,122,26,.85)',1.5);
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,122,26,.9)'; ctx.font='600 11px ui-monospace,monospace';
  const t=P(0,0,0); ctx.fillText('w '+W+'  ·  D '+D, t.x, t.y+18);
}

/* ================= FRAMING BY MEASUREMENT =================
   The old frame fitted K to (W + D*0.42) with a hand-tuned headroom
   constant and a `tall` flag to bump it. Measured against the real ink:
   57 of the 81 shops ran off the canvas, nearly all on the right and
   bottom, because nothing in that formula knew about the things that
   live OUTSIDE the unit box -- kerb crates at a > W, pavement props at
   positive b, roof kit above H, a pylon leaning past the flank.

   So stop predicting the extent and measure it. Draw the shop once to
   an offscreen canvas at a known K and origin, read the alpha bounding
   box, and solve for the K and origin that put that box in the middle
   of the real one. The projection is linear -- screen = K*local + O --
   so inverting a measured box is exact, not a fit.

   Cached per (shop, roof, props, palette) because the toggles genuinely
   change the extent: turning the roof kit off on a shop whose identity
   is a water tank should reframe, not leave a hole at the top. */
const MCV = document.createElement('canvas');
MCV.width = 1100; MCV.height = 1100;
const MCTX = MCV.getContext('2d');
const MK = 0.62, MOX = 550, MOY = 760;      // nominal measure transform
const boundsCache = new Map();
let NOPLATE = false;   // measure pass suppresses the plain roof slab

function measureBounds(){
  const key = state.i + '|' + (state.roof?1:0) + (state.props?1:0) + state.pal;
  if(boundsCache.has(key)) return boundsCache.get(key);
  const sCv = cv, sCtx = ctx, sK = K, sOX = OX, sOY = OY;
  cv = MCV; ctx = MCTX;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,MCV.width,MCV.height);
  K = MK; OX = MOX; OY = MOY;
  /* THE PLATE IS NOT THE SUBJECT. A 276-deep roof slab projects up and
     to the right and is simply the largest thing on screen for every
     shop that has one -- fitting to it shrinks the facade, which is the
     part being dialled, to a strip down the left. So the measure pass
     suppresses the plain plate and frames everything else: facade, sign,
     roof KIT, kerb props, flanks. The plate is still drawn for real and
     is allowed to run off the top corner, which is what the original
     hand-tuned frame was reaching for before it got the numbers wrong. */
  NOPLATE = true;
  ZSCALE = SHOPS[state.i].zs === undefined ? LAB_ZS : SHOPS[state.i].zs;
  SHOPS[state.i].draw(PAL[state.pal]);       // shop only -- pavement is not content
  NOPLATE = false;
  const d = ctx.getImageData(0,0,MCV.width,MCV.height).data;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let y=0;y<MCV.height;y++) for(let x=0;x<MCV.width;x++){
    if(d[(y*MCV.width+x)*4+3] > 8){
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    }
  }
  cv = sCv; ctx = sCtx; K = sK; OX = sOX; OY = sOY;
  /* back out of screen space into local units */
  const b = (x1 < x0) ? {lx0:0,lx1:W,ly0:0,ly1:W} : {
    lx0:(x0-MOX)/MK, lx1:(x1-MOX)/MK, ly0:(y0-MOY)/MK, ly1:(y1-MOY)/MK };
  boundsCache.set(key, b);
  return b;
}

function draw(){
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const cssW = Math.min(document.body.clientWidth, 900);
  const cssH = Math.round(Math.min(600, Math.max(400, cssW*0.86)));
  SCREEN.style.width = cssW+'px'; SCREEN.style.height = cssH+'px';
  SCREEN.width = cssW*dpr; SCREEN.height = cssH*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  const b = measureBounds();
  const PAD = 16;
  const lw = Math.max(1, b.lx1 - b.lx0), lh = Math.max(1, b.ly1 - b.ly0);
  K = Math.min((cssW - PAD*2)/lw, (cssH - PAD*2)/lh);
  /* centre the measured box, then sit it a little low in the frame so a
     shop reads as standing on ground rather than floating mid-canvas */
  OX = (cssW - (b.lx0 + b.lx1)*K)/2;
  OY = (cssH - (b.ly0 + b.ly1)*K)/2 + Math.min(14, (cssH - lh*K)/4);

  pavement();
  ZSCALE = SHOPS[state.i].zs === undefined ? LAB_ZS : SHOPS[state.i].zs;
  SHOPS[state.i].draw(PAL[state.pal]);
  ZSCALE = 1;
  if(state.grid) guides();
}
function sync(){
  const s = SHOPS[state.i];
  document.getElementById('nm').textContent = s.name;
  document.getElementById('ix').textContent = (state.i+1)+' of '+SHOPS.length;
  document.getElementById('mh').textContent = s.head;
  document.getElementById('md').textContent = s.desc;
  document.getElementById('mt').innerHTML = s.tags.map(t=>'<span class="tag">'+t+'</span>').join('');
  draw();
}
document.getElementById('prev').onclick = ()=>{ state.i=(state.i+SHOPS.length-1)%SHOPS.length; sync(); };
document.getElementById('next').onclick = ()=>{ state.i=(state.i+1)%SHOPS.length; sync(); };
for(const [id,key] of [['tRoof','roof'],['tProps','props'],['tGrid','grid']]){
  document.getElementById(id).onclick = e => {
    state[key] = !state[key]; e.currentTarget.classList.toggle('on', state[key]); draw();
  };
}
document.getElementById('tPal').onclick = e => {
  state.pal = (state.pal+1)%PAL.length;
  e.currentTarget.classList.toggle('on', state.pal!==0); draw();
};
document.getElementById('tGrid').classList.remove('on');
addEventListener('resize', draw);
sync();
</script>
