name: Devvit deploy

# Ship tipsey-delivery to Reddit without a Codespace.
#
# GitHub Actions runners CAN reach reddit.com, so this is the reliable ship
# path when the Claude container's network policy blocks Reddit.
#
# One-time setup:
#   1. Log in with devvit somewhere that can reach Reddit (your machine, or a
#      Cloud Shell) and run `devvit login`. This writes ~/.devvit/token.
#   2. Copy the FULL contents of ~/.devvit/token.
#   3. In the repo: Settings -> Secrets and variables -> Actions -> New secret
#      Name: DEVVIT_TOKEN   Value: <paste the token JSON>
#   Re-run these steps whenever the token expires (whoami will start failing).

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'upload = private test version | publish = submit to go live'
        type: choice
        required: true
        default: upload
        options:
          - upload
          - publish
      bump:
        description: 'Semver bump for the new version'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tipsey-delivery
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: tipsey-delivery/.nvmrc

      - name: Install dependencies
        run: npm install --no-fund

      - name: Restore devvit auth token
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: |
          if [ -z "$DEVVIT_TOKEN" ]; then
            echo "::error::DEVVIT_TOKEN secret is not set. See the header of this workflow file for setup steps."
            exit 1
          fi
          mkdir -p ~/.devvit
          printf '%s' "$DEVVIT_TOKEN" > ~/.devvit/token
          chmod 600 ~/.devvit/token

      - name: Verify auth
        run: npx devvit whoami

      - name: Build
        run: npm run build

      - name: Upload
        if: ${{ inputs.action == 'upload' }}
        run: npx devvit upload --bump ${{ inputs.bump }}

      - name: Publish
        if: ${{ inputs.action == 'publish' }}
        run: npx devvit publish --bump ${{ inputs.bump }}
