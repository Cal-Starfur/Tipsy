name: Deploy to Reddit (devvit)

# Manual trigger only — same discipline as the itch.io butler workflow.
# Run from the GitHub app: Actions → Deploy to Reddit (devvit) → Run workflow
on:
  workflow_dispatch:
    inputs:
      action:
        description: "upload = new private version | publish = submit for review/live"
        type: choice
        options:
          - upload
          - publish
        default: upload
      bump:
        description: "Version bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tipsey-delivery

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install devvit CLI
        run: npm install -g devvit

      - name: Restore devvit auth
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
        run: |
          if [ -z "$DEVVIT_TOKEN" ]; then
            echo "::error::DEVVIT_TOKEN secret is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          mkdir -p ~/.devvit
          printf '%s' "$DEVVIT_TOKEN" > ~/.devvit/token
          chmod 600 ~/.devvit/token

      - name: Verify auth
        run: devvit whoami

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: npm run build --if-present

      - name: Upload (private version)
        if: inputs.action == 'upload'
        run: devvit upload --bump ${{ inputs.bump }} --verbose

      - name: Publish (submit for review)
        if: inputs.action == 'publish'
        run: devvit publish --bump ${{ inputs.bump }} --verbose

      - name: Result
        run: echo "devvit ${{ inputs.action }} (${{ inputs.bump }}) completed."
