<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Costa Palma — City Survey — 2026-01-01</title>
<style>
  :root{
    --pave:#d8d2c2; --road:#8a8578; --ink:#2e3138; --ink-soft:#5a5448;
    --housing:#e3d4b8; --park:#8fbf7a; --commercial:#c4c8cc;
    --route:#ff7a1a; --plate:#f4efe3; --plate-line:#b7ad97;
  }
  *{ box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; background:var(--pave);
    font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--ink); }
  #stage{ position:fixed; inset:0; touch-action:none; cursor:grab; }
  #stage.brush{ cursor:crosshair; }
  svg{ display:block; width:100%; height:100%; }
  svg text{ user-select:none; pointer-events:none; }
  .street{ font:600 130px/1 -apple-system,'Helvetica Neue',sans-serif; fill:var(--ink-soft); opacity:.9; }
  .parcel{ font:64px/1 ui-monospace,Menlo,monospace; fill:var(--ink-soft); opacity:.6; }
  .coastname{ font:800 1250px/1 -apple-system,'Helvetica Neue',sans-serif; fill:#8a7a52;
    letter-spacing:.3em; opacity:.8; }
  .oceanname{ font:600 1750px/1 Georgia,'Times New Roman',serif; font-style:italic;
    fill:rgba(255,255,255,.85); letter-spacing:.22em; }
  .rangename{ font:800 1250px/1 -apple-system,'Helvetica Neue',sans-serif; fill:#6f6551;
    letter-spacing:.3em; opacity:.85; }
  .parkname{ font:600 100px/1 -apple-system,'Helvetica Neue',sans-serif; fill:#2f5d38; }
  .blk{ stroke:none; }
  .blk.edited{ stroke:var(--route); stroke-width:14; stroke-dasharray:28 18; }
  .blk.noted{ stroke:var(--ink); stroke-width:8; }
  .blk.edited.noted{ stroke:var(--route); }

  /* title block — surveyor's plate */
  #plate{ position:fixed; top:12px; left:12px; z-index:10; background:var(--plate);
    border:2px solid var(--ink); box-shadow:6px 6px 0 rgba(46,49,56,.18); padding:0; min-width:260px; }
  #plate .row{ padding:8px 14px; border-bottom:1px solid var(--plate-line); }
  #plate .row:last-child{ border-bottom:none; }
  #plate h1{ font:800 15px/1.1 ui-monospace,Menlo,monospace; letter-spacing:.14em; }
  #plate h1 span{ color:var(--route); }
  #plate .sub{ font-size:11px; color:var(--ink-soft); letter-spacing:.06em; margin-top:2px; }
  #legend{ display:flex; gap:12px; align-items:center; font-size:11px; }
  #legend i{ display:inline-block; width:12px; height:12px; border:1px solid var(--ink-soft); margin-right:4px; vertical-align:-2px; }
  #stats{ font-size:11px; color:var(--ink-soft); }

  /* toolbar */
  #bar{ position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom));
    z-index:10; display:flex; gap:8px; align-items:stretch; flex-wrap:wrap; }
  .tool{ background:var(--plate); border:2px solid var(--ink); padding:10px 14px;
    font:inherit; color:var(--ink); min-height:44px; box-shadow:4px 4px 0 rgba(46,49,56,.18); }
  .tool.on{ background:var(--ink); color:var(--plate); }
  .tool.hb{ background:var(--housing); } .tool.pb{ background:var(--park); } .tool.cb{ background:var(--commercial); }
  .tool.hb.on,.tool.pb.on,.tool.cb.on{ outline:3px solid var(--route); outline-offset:-3px; color:var(--ink); }
  #exportBtn{ margin-left:auto; background:var(--route); border-color:var(--ink); font-weight:700; }
  #brushRow{ display:none; gap:8px; }
  #bar.brushing #brushRow{ display:flex; }

  /* inspector card */
  #card{ position:fixed; right:12px; top:12px; z-index:11; background:var(--plate);
    border:2px solid var(--ink); box-shadow:6px 6px 0 rgba(46,49,56,.18);
    padding:12px 14px; width:min(320px, calc(100vw - 24px)); display:none; }
  #card.show{ display:block; }
  #card h2{ font:800 13px/1 ui-monospace,Menlo,monospace; letter-spacing:.1em; margin-bottom:8px; }
  #card .meta{ font-size:11px; color:var(--ink-soft); margin-bottom:8px; }
  #card textarea{ width:100%; height:64px; font:inherit; font-size:12px; border:1px solid var(--ink-soft);
    background:#fff; padding:6px; resize:none; }
  #card .actions{ display:flex; gap:8px; margin-top:8px; }
  #card .actions .tool{ box-shadow:none; padding:8px 10px; min-height:38px; flex:1; }
  #exportOut{ position:fixed; inset:8% 6%; z-index:20; background:var(--plate); border:2px solid var(--ink);
    box-shadow:8px 8px 0 rgba(46,49,56,.25); padding:14px; display:none; flex-direction:column; gap:10px; }
  #exportOut.show{ display:flex; }
  #exportOut textarea{ flex:1; font:11px/1.5 ui-monospace,Menlo,monospace; border:1px solid var(--ink-soft); padding:8px; }
  @media (prefers-reduced-motion: no-preference){
    .blk{ transition:fill .15s ease; }
  }
</style>
</head>
<body>
<div id="stage"><svg id="svg"></svg></div>

<div id="plate">
  <div class="row">
    <h1>COSTA PALMA <span>— CITY SURVEY</span></h1>
    <div class="sub" id="plateSub"></div>
  </div>
  <div class="row" id="legend">
    <span><i style="background:var(--housing)"></i>housing</span>
    <span><i style="background:var(--park)"></i>park</span>
    <span><i style="background:var(--commercial)"></i>commercial</span>
    <span><i style="background:var(--route);border:none"></i>route</span>
    <span><i style="background:#f0e2ae"></i>beach</span>
    <span><i style="background:#c89a6b"></i>boardwalk</span>
    <span><i style="background:#7fb2c9"></i>marina</span>
    <span><i style="background:#f2ece0;border-color:#b7a98d"></i>estates</span>

    <span><i style="background:#cfc69b"></i>foothills</span>
    <span><i style="background:#a89b82"></i>mountains</span>
  </div>
  <div class="row" id="stats"></div>
</div>

<div id="card">
  <h2 id="cardTitle"></h2>
  <div class="meta" id="cardMeta"></div>
  <textarea id="cardNote" placeholder="Note for this block — what should change here?"></textarea>
  <div class="actions">
    <button class="tool" id="cardSave">Save note</button>
    <button class="tool" id="cardRevert">Revert block</button>
    <button class="tool" id="cardClose">Close</button>
  </div>
</div>

<div id="bar">
  <button class="tool" id="modeBtn">Repaint: off</button>
  <div id="brushRow">
    <button class="tool hb" data-brush="housing">housing</button>
    <button class="tool pb on" data-brush="park">park</button>
    <button class="tool cb" data-brush="commercial">commercial</button>
  </div>
  <button class="tool" id="routeBtn">Route: on</button>
  <button class="tool" id="exportBtn">Export edits (0)</button>
</div>

<div id="exportOut">
  <h2 style="font:800 13px ui-monospace,Menlo,monospace;letter-spacing:.1em">EDITS — costa-palma-2026-01-01</h2>
  <textarea id="exportText" readonly></textarea>
  <div style="display:flex;gap:8px">
    <button class="tool" id="copyBtn">Copy JSON</button>
    <button class="tool" id="dlBtn">Download .json</button>
    <button class="tool" id="exportClose" style="margin-left:auto">Close</button>
  </div>
</div>

   district — 2nd St extended north into Sierra Vista, and the row
   street at j=10 extended east into Mirador Heights. This is what makes
   the hills read as part of the city instead of parked next to it. */
/* access roads live ABOVE the block layer — the coast group renders
   under the perimeter lots, which was quietly swallowing the stubs. */
const gAccess = g(root);
root.insertBefore(gAccess, gParks);
function accessRoad(x1a, y1a, x2a, y2a){
  const l = document.createElementNS(NS,'line');
  l.setAttribute('x1',x1a); l.setAttribute('y1',y1a);
  l.setAttribute('x2',x2a); l.setAttribute('y2',y2a);
  l.setAttribute('stroke','#7d7869'); l.setAttribute('stroke-width',40);
  l.setAttribute('stroke-linecap','round');
  gAccess.appendChild(l);
}
const nwX0 = LX + B*0.15, nwX1 = LX + B*3.3, nwY0 = TY - FOOT - B*0.95, nwY1 = TY - B*0.08;
const eX0 = RX + B*0.08, eX1 = RX + FOOT + B*0.75;
const eY0 = TY + (BY - TY)*0.45, eY1 = TY + (BY - TY)*0.92;
const nwEntry = { x: 1*B, y: nwY1 };            // 2nd St meets the district
const eEntry  = { x: eX0, y: 10*B };            // row street j=10 meets the slope
accessRoad(1*B, 0, nwEntry.x, nwEntry.y);
accessRoad((CITY.cols-1)*B, 10*B, eEntry.x, eEntry.y);
const nwLots = estateDistrict(nwX0, nwY0, nwX1, nwY1, 0xe57a7e5, nwEntry);
const eLots  = estateDistrict(eX0, eY0, eX1, eY1, 0xe57a7e6, eEntry);
const coastText = (x, y, cls, rot) => {
  const t = document.createElementNS(NS,'text');
  t.setAttribute('text-anchor','middle');
  t.setAttribute('class',cls);
  t.setAttribute('transform', `translate(${x},${y})` + (rot?` rotate(${rot})`:''));
  gCoastLbl.appendChild(t); return t;
};
const tWest  = coastText(LX - BOARD - SAND/2, TY + (BY - TY)/2, 'coastname', -90);
const tSouth = coastText(LX + (RX - LX)/2, BY + BOARD + SAND/2 + 430, 'coastname');
const tOcean = coastText(LX + (RX - LX)*0.42, BY + BOARD + SAND + OCEAN*0.58, 'oceanname');
const tNorth = coastText(LX + (RX - LX)/2, TY - FOOT - MTN*0.62, 'rangename');
const tEast  = coastText(RX + FOOT + MTN*0.62, TY + (BY - TY)/2, 'rangename', -90);
const tPier = coastText(pierX0 + PIERLEN*0.55, pierY - PIERW/2 - 520, 'coastname');
tPier.setAttribute('font-size', 440);
const tMarina = coastText(MX0 + (MX1 - MX0)*0.32, MY0 + (MY1 - MY0)*0.42, 'coastname', -90);
tMarina.setAttribute('font-size', 420);
const tEstNW = coastText((nwX0 + nwX1)/2, nwY0 - 260, 'rangename');
tEstNW.setAttribute('font-size', 380);
const tEstE = coastText(eX0 - 300, (eY0 + eY1)/2, 'rangename', -90);
tEstE.setAttribute('font-size', 380);
const tAqua = coastText(pierX0, pierY + B*0.36 + 980, 'coastname');
tAqua.setAttribute('font-size', 320);
function refreshCoast(){
  tWest.textContent  = coast.west.name.toUpperCase();
  tSouth.textContent = coast.south.name.toUpperCase();
  tOcean.textContent = coast.ocean.name.toUpperCase();
  tNorth.textContent = coast.north.name.toUpperCase();
  tEast.textContent  = coast.east.name.toUpperCase();
  tPier.textContent = coast.pier.name.toUpperCase();
  tAqua.textContent = coast.aquarium.name.toUpperCase();
  tMarina.textContent = coast.marina.name.toUpperCase();
  tEstNW.textContent = coast.estNW.name.toUpperCase();
  tEstE.textContent = coast.estE.name.toUpperCase();
}
refreshCoast();
function renameCoast(which){
  if(moved) return;
  const v = prompt('Name this ' + (which==='ocean'?'ocean':(which==='north'||which==='east')?'range':(which==='pier'||which==='aquarium')?'landmark':'beach'), coast[which].name);
  if(v && v.trim()){ coast[which].name = v.trim(); refreshCoast(); }
}
elWest.style.pointerEvents = 'all';
elSouth.style.pointerEvents = 'all';
elWest.addEventListener('pointerup', () => renameCoast('west'));
elSouth.addEventListener('pointerup', () => renameCoast('south'));
for(const [el, key] of [[elNorthF,'north'],[elNorth,'north'],[elEastF,'east'],[elEast,'east'],
                        [elPier,'pier'],[elRound,'pier'],[elAqua,'aquarium'],
                        [elBasin,'marina'],[elQuay,'marina'],
                        ...nwLots.map(l => [l,'estNW']), ...eLots.map(l => [l,'estE'])]){
  el.style.pointerEvents = 'all';
  el.addEventListener('pointerup', () => renameCoast(key));
}
gCoast.firstChild.style.pointerEvents = 'all';
gCoast.firstChild.addEventListener('pointerup', () => renameCoast('ocean'));

/* blocks — interior parcels and exterior lots through the same pass */
const blockEls = new Map();
function drawBlock(b){
  const r = document.createElementNS(NS,'rect');
  r.setAttribute('x', b.x0); r.setAttribute('y', b.y0);
  r.setAttribute('width', b.x1-b.x0); r.setAttribute('height', b.y1-b.y0);
  r.setAttribute('class','blk');
  r.setAttribute('fill', COLORS[b.type]);
  r.style.pointerEvents = 'all';
  r.addEventListener('pointerup', ev => onBlockTap(ev, b));
  gBlocks.appendChild(r);
  blockEls.set(keyOf(b), r);
  const t = document.createElementNS(NS,'text');
  t.setAttribute('x', b.x0 + 28); t.setAttribute('y', b.y0 + 88);
  t.setAttribute('class','parcel');
  t.textContent = b.ext ? ('E'+b.k) : (b.i + '·' + b.j);
  gBlocks.appendChild(t);
}
CITY.blocks.forEach(drawBlock);
CITY.extLots.forEach(drawBlock);

/* ---------- streets react to the parks ----------
   A street edge runs between two block cells. When both of those cells
   are park, they are by definition members of the same merged component
   — so that street no longer exists: it dead-ends at the park boundary
   instead of cutting the grass in two. Same rule decides whether a
   street's name label appears. Both passes rebuild with every repaint,
   through rebuildParks, so painting a bridge parcel closes the road the
   same moment it fuses the grass. */
const isPark = (i,j) => { const b = byIJ.get(i+','+j); return !!b && effType(b) === 'park'; };
const hSwallowed = (i,j) => isPark(i, j-1) && isPark(i, j);   // horizontal edge at node row j
const vSwallowed = (i,j) => isPark(i-1, j) && isPark(i, j);   // vertical edge at node col i
function rebuildRoads(){
  gRoads.textContent = '';
  for(const e of CITY.edges){
    if(e.f === 0 ? hSwallowed(e.i, e.j) : vSwallowed(e.i, e.j)) continue;
    const l = document.createElementNS(NS,'line');
    l.setAttribute('x1',e.ax); l.setAttribute('y1',e.ay);
    l.setAttribute('x2',e.bx); l.setAttribute('y2',e.by);
    l.setAttribute('stroke','#7d7869'); l.setAttribute('stroke-width',40);
    l.setAttribute('stroke-linecap','round');
    gRoads.appendChild(l);
  }
}

/* street names — one per row/col, the game's own convention:
   horizontal streets use the hood pool, vertical streets are numbered */
const ord = n => n + ((n%10===1&&n!==11)?'st':(n%10===2&&n!==12)?'nd':(n%10===3&&n!==13)?'rd':'th');
const gStreetLbl = g(gLabels);
/* every street keeps its name in view at working zoom: the label repeats
   every 4 blocks — but never on a segment a merged park has swallowed */
function rebuildStreetLabels(){
  gStreetLbl.textContent = '';
  const REP = 4;
  for(let j = 0; j < CITY.rows; j++){
    const name = CITY.hood.streets[j % CITY.hood.streets.length];
    for(let i = 1; i < CITY.cols-1; i += REP){
      if(hSwallowed(i, j)) continue;
      const t = document.createElementNS(NS,'text');
      t.setAttribute('x', i*B + B*0.5); t.setAttribute('y', j*B - 26);
      t.setAttribute('text-anchor','middle'); t.setAttribute('class','street');
      t.textContent = name;
      gStreetLbl.appendChild(t);
    }
  }
  for(let i = 0; i < CITY.cols; i++){
    const name = ord(i+1) + ' St';
    for(let j = 1; j < CITY.rows-1; j += REP){
      if(vSwallowed(i, j)) continue;
      const t = document.createElementNS(NS,'text');
      t.setAttribute('class','street');
      t.setAttribute('transform', `translate(${i*B - 26},${j*B + B*0.5}) rotate(-90)`);
      t.setAttribute('text-anchor','middle');
      t.textContent = name;
      gStreetLbl.appendChild(t);
    }
  }
}
/* park names: the game's own seeded formula, reimplemented here so a
   parcel repainted to park gets a real name from the hood pool instead
   of going nameless. Perimeter lots label statically; interior parks are
   named by rebuildParks so merged parks can carry one name. */
function mb32(a){ return function(){ a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const parkNameOf = b => {
  const s = ((Math.round(b.cx)*7919) ^ (Math.round(b.cy)*104729)) >>> 0;
  return CITY.hood.parks[Math.floor(mb32(s)() * CITY.hood.parks.length)];
};
/* ---------- unique park names ----------
   Ten pool names across a hundred-odd parks meant a city full of twin
   Banyan Parks. Names stay seeded from position — same start point the
   game uses — but a taken name advances through kind words (Park, Green,
   Commons...) and then direction prefixes until it lands on one nobody
   holds. Deterministic scan order (perimeter first, then parcels by
   row) makes the whole christening reproducible. */
const PARK_KINDS = ['Park','Green','Commons','Square','Gardens','Grove','Meadow','Plaza','Court','Playfield'];
const PARK_DIRS  = ['North','South','East','West','Old','New','Upper','Lower'];
function uniqueParkName(b, used){
  const s = ((Math.round(b.cx)*7919) ^ (Math.round(b.cy)*104729)) >>> 0;
  const r = mb32(s);
  const base = CITY.hood.parks[Math.floor(r() * CITY.hood.parks.length)];
  const k0 = Math.floor(r() * PARK_KINDS.length);
  for(let k = 0; k < PARK_KINDS.length; k++){
    const name = base + ' ' + PARK_KINDS[(k0+k) % PARK_KINDS.length];
    if(!used.has(name)){ used.add(name); return name; }
  }
  for(const d of PARK_DIRS) for(let k = 0; k < PARK_KINDS.length; k++){
    const name = d + ' ' + base + ' ' + PARK_KINDS[(k0+k) % PARK_KINDS.length];
    if(!used.has(name)){ used.add(name); return name; }
  }
  const name = base + ' Park ' + (used.size+1);
  used.add(name); return name;
}

/* ---------- merged parks ----------
   Interior parcels that are park AND orthogonal neighbours fuse into one
   park: the grass extends over the street between them, and the whole
   component carries a single name (its top-left member's), scaled up
   with size. Recomputed after every repaint, so painting two parks
   together joins them the moment the brush lands. */
const byIJ = new Map(CITY.blocks.map(b => [b.i+','+b.j, b]));
const effType = b => { const e = editOf(b); return (e && e.type) || b.type; };
function rebuildParks(){
  gParks.textContent = '';
  const used = new Set();
  /* perimeter lots christen first — they never change, so their names
     hold steady while parcel edits reshuffle only the interior */
  for(const b of CITY.extLots){
    if(b.type !== 'park') continue;
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x', b.cx); t.setAttribute('y', b.cy);
    t.setAttribute('text-anchor','middle'); t.setAttribute('class','parkname');
    t.textContent = uniqueParkName(b, used);
    gParks.appendChild(t);
  }
  const seen = new Set();
  for(const b0 of CITY.blocks){
    const k0 = b0.i+','+b0.j;
    if(seen.has(k0) || effType(b0) !== 'park') continue;
    /* flood the component */
    const comp = [], q = [b0]; seen.add(k0);
    while(q.length){
      const b = q.pop(); comp.push(b);
      for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const n = byIJ.get((b.i+di)+','+(b.j+dj));
        if(n && !seen.has(n.i+','+n.j) && effType(n) === 'park'){
          seen.add(n.i+','+n.j); q.push(n);
        }
      }
    }
    const member = (i,j) => { const n = byIJ.get(i+','+j); return n && effType(n) === 'park'; };
    if(comp.length > 1){
      /* one rect per member, edges pushed past the cell line only toward
         other members — overlap kills the seam, non-member sides keep the
         parcel's own inset so the park never leans on a neighbour */
      const OV = 60;
      for(const b of comp){
        const x0 = member(b.i-1,b.j) ? b.i*B - OV     : b.x0;
        const x1 = member(b.i+1,b.j) ? (b.i+1)*B + OV : b.x1;
        const y0 = member(b.i,b.j-1) ? b.j*B - OV     : b.y0;
        const y1 = member(b.i,b.j+1) ? (b.j+1)*B + OV : b.y1;
        const r = document.createElementNS(NS,'rect');
        r.setAttribute('x',x0); r.setAttribute('y',y0);
        r.setAttribute('width',x1-x0); r.setAttribute('height',y1-y0);
        r.setAttribute('fill','#8fbf7a');
        gParks.appendChild(r);
      }
    }
    /* one name per component: the top-left member speaks for all of it */
    const anchor = comp.reduce((a,b) => (b.j < a.j || (b.j === a.j && b.i < a.i)) ? b : a);
    const cx = comp.reduce((s,b)=>s+b.cx,0)/comp.length;
    const cy = comp.reduce((s,b)=>s+b.cy,0)/comp.length;
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x',cx); t.setAttribute('y',cy);
    t.setAttribute('text-anchor','middle'); t.setAttribute('class','parkname');
    if(comp.length > 1){
      const scale = Math.min(2.6, 1 + 0.35*(comp.length-1));
      t.setAttribute('font-size', Math.round(100*scale));
    }
    t.textContent = uniqueParkName(anchor, used);
    gParks.appendChild(t);
  }
  rebuildRoads();
  rebuildStreetLabels();
}
rebuildParks();

/* today's walked route + door */
const poly = document.createElementNS(NS,'polyline');
poly.setAttribute('points', CITY.walk.map(p=>p.join(',')).join(' '));
poly.setAttribute('fill','none'); poly.setAttribute('stroke','#ff7a1a');
poly.setAttribute('stroke-width',60); poly.setAttribute('stroke-linecap','round');
poly.setAttribute('stroke-linejoin','round'); poly.setAttribute('opacity','0.9');
gRoute.appendChild(poly);
const door = document.createElementNS(NS,'circle');
door.setAttribute('cx',CITY.door[0]); door.setAttribute('cy',CITY.door[1]);
door.setAttribute('r',44); door.setAttribute('fill','#ff7a1a'); door.setAttribute('stroke','#2e3138');
door.setAttribute('stroke-width',10);
gRoute.appendChild(door);

/* ---------- plate ---------- */
document.getElementById('plateSub').textContent =
  `${CITY.hood.name.toUpperCase()} · ${CITY.dateStr} · seed ${CITY.seed} · ${CITY.night?'night':'day'} route`;
function refreshStats(){
  const all = CITY.blocks.concat(CITY.extLots);
  const c = { housing:0, park:0, commercial:0 };
  for(const b of all){ const e = editOf(b); c[(e&&e.type)||b.type]++; }
  document.getElementById('stats').textContent =
    `${CITY.cols-1}×${CITY.rows-1} parcels + ${CITY.extLots.length} perimeter lots · ` +
    `${c.housing} housing / ${c.park} park / ${c.commercial} commercial`;
  document.getElementById('exportBtn').textContent = `Export edits (${edits.size})`;
}
refreshStats();

/* ---------- pan / zoom (pointer + pinch) ---------- */
let view = { x:LX - BOARD - SAND - OCEAN, y:TY - FOOT - MTN, w:(RX - LX) + BOARD + SAND + OCEAN + FOOT + MTN, h:(BY - TY) + FOOT + MTN + BOARD + SAND + OCEAN };
function applyView(){
  svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  /* names carry no information the colours don't until you're close enough
     to read them — below ~60% of full width they come in, above they go */
  gLabels.style.display = view.w > w*0.6 ? 'none' : '';
}
applyView();
const ptrs = new Map();
let pinch0 = null, moved = false;
stage.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = false;
  if(ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    pinch0 = { d: Math.hypot(a.x-b.x, a.y-b.y), view: {...view},
               cx:(a.x+b.x)/2, cy:(a.y+b.y)/2 };
  }
});
stage.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId);
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  if(Math.hypot(dx,dy) > 4) moved = true;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const scale = view.w / stage.clientWidth;
  if(ptrs.size === 1){
    view.x -= dx*scale; view.y -= dy*scale; applyView();
  } else if(ptrs.size === 2 && pinch0){
    const [a,b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const z = Math.min(6, Math.max(0.5, pinch0.d / d));
    const px = pinch0.view.x + (pinch0.cx/stage.clientWidth)*pinch0.view.w;
    const py = pinch0.view.y + (pinch0.cy/stage.clientHeight)*pinch0.view.h;
    view.w = pinch0.view.w * z; view.h = pinch0.view.h * z;
    view.x = px - (pinch0.cx/stage.clientWidth)*view.w;
    view.y = py - (pinch0.cy/stage.clientHeight)*view.h;
    applyView();
  }
});
const drop = e => { ptrs.delete(e.pointerId); if(ptrs.size < 2) pinch0 = null; };
stage.addEventListener('pointerup', drop);
stage.addEventListener('pointercancel', drop);
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const z = e.deltaY > 0 ? 1.12 : 1/1.12;
  const px = view.x + (e.clientX/stage.clientWidth)*view.w;
  const py = view.y + (e.clientY/stage.clientHeight)*view.h;
  view.w = Math.min(w*1.6, Math.max(w/8, view.w*z)); view.h = view.w * (h/w);
  view.x = px - (e.clientX/stage.clientWidth)*view.w;
  view.y = py - (e.clientY/stage.clientHeight)*view.h;
  applyView();
}, { passive:false });

/* ---------- editing ---------- */
let brushing = false, brush = 'park', current = null;
const bar = document.getElementById('bar');
document.getElementById('modeBtn').onclick = () => {
  brushing = !brushing;
  bar.classList.toggle('brushing', brushing);
  stage.classList.toggle('brush', brushing);
  document.getElementById('modeBtn').textContent = 'Repaint: ' + (brushing?'on':'off');
  document.getElementById('modeBtn').classList.toggle('on', brushing);
};
document.querySelectorAll('#brushRow .tool').forEach(el => el.onclick = () => {
  brush = el.dataset.brush;
  document.querySelectorAll('#brushRow .tool').forEach(x => x.classList.toggle('on', x===el));
});
document.getElementById('routeBtn').onclick = () => {
  const on = gRoute.style.display !== 'none';
  gRoute.style.display = on ? 'none' : '';
  document.getElementById('routeBtn').textContent = 'Route: ' + (on?'off':'on');
};

function paintBlock(b){
  const el = blockEls.get(keyOf(b));
  const e = editOf(b);
  const t = (e && e.type) || b.type;
  el.setAttribute('fill', COLORS[t]);
  el.classList.toggle('edited', !!(e && e.type && e.type !== b.type));
  el.classList.toggle('noted', !!(e && e.note));
  if(!b.ext) rebuildParks();
}
function onBlockTap(ev, b){
  if(moved) return;                    // a drag is not a tap
  if(brushing){
    const e = touch(b);
    e.type = (brush === b.type) ? null : brush;   // painting the original clears the edit
    prune(b); paintBlock(b); refreshStats();
    return;
  }
  openCard(b);
}
const card = document.getElementById('card');
function openCard(b){
  current = b;
  const e = editOf(b);
  document.getElementById('cardTitle').textContent =
    (b.ext ? `PERIMETER LOT E${b.k}` : `PARCEL ${b.i}·${b.j}`);
  document.getElementById('cardMeta').textContent =
    `type: ${b.type}` + (e && e.type ? ` → ${e.type}` : '') +
    ` · centre ${Math.round(b.cx)},${Math.round(b.cy)}`;
  document.getElementById('cardNote').value = (e && e.note) || '';
  card.classList.add('show');
}
document.getElementById('cardSave').onclick = () => {
  if(!current) return;
  const e = touch(current);
  e.note = document.getElementById('cardNote').value.trim();
  prune(current); paintBlock(current); refreshStats();
  card.classList.remove('show');
};
document.getElementById('cardRevert').onclick = () => {
  if(!current) return;
  edits.delete(keyOf(current));
  paintBlock(current); refreshStats();
  card.classList.remove('show');
};
document.getElementById('cardClose').onclick = () => card.classList.remove('show');

/* ---------- export ---------- */
const exportOut = document.getElementById('exportOut');
document.getElementById('exportBtn').onclick = () => {
  const list = [...edits.values()].map(e => ({
    ...(e.ext ? { ext:e.k } : { i:e.i, j:e.j }),
    from:e.from, ...(e.type ? { type:e.type } : {}), ...(e.note ? { note:e.note } : {})
  }));
  document.getElementById('exportText').value = JSON.stringify(
    { city:'costa-palma', dateStr:CITY.dateStr, seed:CITY.seed,
      coast:{ west:coast.west.name, south:coast.south.name, ocean:coast.ocean.name,
              north:coast.north.name, east:coast.east.name,
              pier:coast.pier.name, aquarium:coast.aquarium.name,
              marina:coast.marina.name,
              estNW:coast.estNW.name, estE:coast.estE.name },
      edits:list }, null, 2);
  exportOut.classList.add('show');
};
document.getElementById('copyBtn').onclick = async () => {
  const ta = document.getElementById('exportText');
  ta.select(); ta.setSelectionRange(0, 999999);
  try { await navigator.clipboard.writeText(ta.value);
        document.getElementById('copyBtn').textContent = 'Copied'; }
  catch(_) { document.execCommand('copy'); document.getElementById('copyBtn').textContent = 'Copied'; }
  setTimeout(()=>document.getElementById('copyBtn').textContent='Copy JSON', 1500);
};
document.getElementById('dlBtn').onclick = () => {
  const blob = new Blob([document.getElementById('exportText').value], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `costa-palma-edits-${CITY.dateStr}.json`;
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('exportClose').onclick = () => exportOut.classList.remove('show');
</script>
