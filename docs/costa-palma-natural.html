<title>Costa Palma Natural Survey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a full-bleed survey map; one title plate top-left, one control strip along the bottom. */
:root{
  --plate:#f3f1f6; --ink:#262833; --ink-soft:#5d6070; --line:#b9b6c6; --accent:#e0703a; --shadow:rgba(38,40,51,.18);
  --sea:#4f8fbd;
  --display:'Space Grotesk', -apple-system, 'Helvetica Neue', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --plate:#1f212a; --ink:#eceaf2; --ink-soft:#a6a8b8; --line:#454857; --accent:#f08a55; --shadow:rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{ --plate:#1f212a; --ink:#eceaf2; --ink-soft:#a6a8b8; --line:#454857; --accent:#f08a55; --shadow:rgba(0,0,0,.45); color-scheme:dark }
html,body{ height:100%; overflow:hidden; }
body{ background:var(--sea); color:var(--ink); font:13px/1.4 var(--mono); -webkit-tap-highlight-color:transparent; }
#cv{ position:fixed; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; display:block; }
#plate{ position:fixed; z-index:5; top:calc(12px + env(safe-area-inset-top, 0px)); left:max(16px, env(safe-area-inset-left, 0px));
  background:var(--plate); border:1.5px solid var(--ink); box-shadow:5px 5px 0 var(--shadow); max-width:min(380px, calc(100vw - 32px)); }
#plate .row{ padding:9px 14px; border-bottom:1px solid var(--line); }
#plate .row:last-child{ border-bottom:none; }
#plate h1{ font:700 16px/1.1 var(--display); letter-spacing:.08em; text-transform:uppercase; text-wrap:balance; }
#plate h1 span{ color:var(--accent); }
#sub{ font-size:11px; color:var(--ink-soft); margin-top:3px; }
#legend{ display:flex; flex-wrap:wrap; gap:6px 12px; font-size:11px; }
#legend i{ display:inline-block; width:11px; height:11px; margin-right:4px; vertical-align:-1px; border:1px solid rgba(0,0,0,.25); }
#stats{ font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
#plate.min #legend, #plate.min #stats{ display:none; }
#bar{ position:fixed; z-index:5; left:0; right:0; bottom:0; display:flex; flex-wrap:wrap; gap:8px; align-items:stretch;
  padding:0 max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); pointer-events:none; }
#bar > *{ pointer-events:auto; }
.seg{ display:flex; border:1.5px solid var(--ink); box-shadow:4px 4px 0 var(--shadow); background:var(--plate); }
.seg button, .tool{ font:600 12px var(--mono); letter-spacing:.04em; color:var(--ink); background:var(--plate); border:none; padding:10px 14px; min-height:44px; cursor:pointer; }
.seg button + button{ border-left:1.5px solid var(--ink); }
.seg button.on{ background:var(--ink); color:var(--plate); }
.tool{ border:1.5px solid var(--ink); box-shadow:4px 4px 0 var(--shadow); }
.tool.on{ background:var(--ink); color:var(--plate); }
button:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
#bendBox{ display:flex; align-items:center; gap:10px; padding:0 14px; border:1.5px solid var(--ink); box-shadow:4px 4px 0 var(--shadow); background:var(--plate); min-height:44px; flex:1 1 220px; max-width:420px; }
#bendBox label{ font-weight:600; font-size:12px; letter-spacing:.04em; }
#bend{ flex:1; min-width:0; accent-color:var(--accent); }
#bendVal{ width:3.2em; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-soft); }
</style>

<canvas id="cv"></canvas>

<div id="plate">
  <div class="row">
    <h1>Costa Palma <span>· natural survey</span></h1>
    <div id="sub">Prototype. Same parcels as the game, bent to the land: the coast, the hills and a river.</div>
  </div>
  <div class="row" id="legend">
    <span><i style="background:#c3bdd8"></i>commercial</span>
    <span><i style="background:#e8e0d1"></i>housing</span>
    <span><i style="background:#93be8c"></i>park</span>
    <span><i style="background:#f1dc8c"></i>highway</span>
    <span><i style="background:#e6d39f"></i>beach</span>
    <span><i style="background:#6f9a7f"></i>hills</span>
    <span><i style="background:#69acd3"></i>river / sea</span>
    <span><i style="background:#f5efe3"></i>hill estates</span>
  </div>
  <div class="row" id="stats"></div>
</div>

<div id="bar">
  <div class="seg" role="group" aria-label="Map version">
    <button id="bGrid" type="button">Grid today</button>
    <button id="bNat" type="button" class="on">Natural</button>
  </div>
  <div id="bendBox"><label for="bend">Bend</label><input id="bend" type="range" min="0" max="100" value="100"><span id="bendVal">100%</span></div>
  <button id="bTopo" type="button" class="tool on">Contours</button>
  <button id="bInfo" type="button" class="tool">Hide key</button>
</div>

const X0 = -8.4, X1 = 24.4, Y0 = -7.2, Y1 = 24.6;          // the plate, in blocks

/* THE WARP: streets near an edge take that edge's shape (the coast's swell, the

/* ===== land, sea and height ===== */
const ISLES = [[-5.0, 9.6, 1.0], [-4.4, 19.8, 1.15], [2.6, 20.9, 1.2], [11.8, 22.3, 0.8], [18.6, 21.6, 0.75]];
let MARINA = null;
function landS(u, v){

/* river: a meandering line from the Sierra down through the east side to Driftwood Beach */
const RIVER_CP = [[12.9,-6.2],[12.2,-4.4],[13.4,-2.8],[12.0,-1.2],[10.9,0.9],[11.6,3.1],[10.1,5.2],[8.9,7.4],[9.9,9.8],[8.4,12.0],[6.8,13.6],[7.6,15.8],[6.4,18.0],[6.0,20.6],[5.8,23.8]];

/* ===== geometry: everything built in grid space, then warped ===== */

function build(){

        if(acc < 0.3 || k < road.length*0.12) continue; acc = 0;
        const tx = b[0] - a[0], ty = b[1] - a[1], tl = Math.hypot(tx, ty) || 1, nx = -ty/tl, ny = tx/tl;
        for(const sd of [-1, 1]){ const c = [b[0] + nx*sd*0.2, b[1] + ny*sd*0.2];
          if(landS(c[0], c[1]) < 0.35) continue;
          if(road.some(p => Math.hypot(p[0] - c[0], p[1] - c[1]) < 0.14)) continue;
          out.estates.push({ c, a: Math.atan2(ty, tx) }); }
      }
    }
    /* the pier off Sunset Shore, the causeway to Driftwood Key */
    const ps = warp(-0.95, 8); let px = ps[0]; while(landS(px, ps[1]) > -1.9 && px > X0 + 0.5) px -= 0.05;
    out.pier = [ps, [px, ps[1]]];
    const isle = ISLES[2], cs = warp(isle[0], N + 0.95);
    out.causeway = [cs, [isle[0], isle[1] - 0.2]];
    out.riverPoly = ribbon(RIVER, k => riverW(RIVER[k][1])*Math.min(1, T*1.5));
  }
  G = out; G.blocks = blocks.concat(lots);
  refreshStats();
}
function ribbon(P, wf){ const L = [], R = []; for(let k = 0; k < P.length; k++){ const a = P[Math.max(0, k - 1)], b = P[Math.min(P.length - 1, k + 1)];
  const tx = b[0] - a[0], ty = b[1] - a[1], tl = Math.hypot(tx, ty) || 1, w = wf(k); L.push([P[k][0] - ty/tl*w, P[k][1] + tx/tl*w]); R.push([P[k][0] + ty/tl*w, P[k][1] - tx/tl*w]); }
  return L.concat(R.reverse()); }

/* ===== drawing ===== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let view = { cx: (X0 + X1)/2, cy: (Y0 + Y1)/2, s: 30 }, dpr = 1, need = true;
function clampView(){ const W = innerWidth, H = innerHeight, sMin = Math.max(W/(X1 - X0), H/(Y1 - Y0));
  if(view.s < sMin) view.s = sMin;
  const hw = W/2/view.s, hh = H/2/view.s; view.cx = clamp(view.cx, X0 + hw, X1 - hw); view.cy = clamp(view.cy, Y0 + hh, Y1 - hh); }
function fit(){ const W = innerWidth, H = innerHeight; view.s = Math.min(W/27, H/28.5); view.cx = 7.6; view.cy = 8.6; clampView(); }
function resize(){ dpr = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; need = true; }
const COL = { commercial: '#c3bdd8', housing: '#e8e0d1', park: '#93be8c', pave: '#d8d4e2', road: '#fdfcf8', casing: '#a49fb6',
  hwy: '#f1dc8c', hwyCase: '#b99a4a', river: '#69acd3', riverEdge: '#4f93bf', estate: '#f5efe3', estateEdge: '#b9ad94', wood: '#c4956a' };
function polyPath(P, close){ const p = new Path2D(); P.forEach((q, k) => k ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); if(close) p.closePath(); return p; }
function strokeLines(list, w, col, cap){ ctx.lineWidth = w; ctx.strokeStyle = col; ctx.lineCap = cap || 'round'; ctx.lineJoin = 'round'; for(const P of list) ctx.stroke(polyPath(P)); }
function px(n){ return n/view.s; }
function draw(){
  need = false; clampView();
  const W = innerWidth, H = innerHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#4c8cbc'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(dpr*view.s, 0, 0, dpr*view.s, dpr*(W/2 - view.cx*view.s), dpr*(H/2 - view.cy*view.s));
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(terrain, X0, Y0, X1 - X0, Y1 - Y0);
  if(!G) return;
  /* the town's ground: the ring of everything inside the coast road */
  ctx.fillStyle = COL.pave; for(const b of G.blocks) if(!b.wet) ctx.fill(polyPath(b.cell, true));
  for(const b of G.blocks){ if(b.wet) continue; ctx.fillStyle = COL[b.eff]; ctx.fill(polyPath(b.poly, true)); }
  ctx.drawImage(waterTop, X0, Y0, X1 - X0, Y1 - Y0);              // the sea over any of the town it reached
  const rw = Math.max(0.06, px(1.6)), cw = rw + Math.max(0.025, px(1.1));
  if(G.riverPoly){ ctx.fillStyle = COL.river; ctx.strokeStyle = COL.riverEdge; ctx.lineWidth = px(1); const rp = polyPath(G.riverPoly, true); ctx.fill(rp); ctx.stroke(rp); }
  const hill = [G.sierra, G.mirador, G.skyline, G.canyon].filter(Boolean);
  strokeLines(G.roads, cw, COL.casing); strokeLines(hill, cw, COL.casing);
  if(G.estates){ const L = 0.11, Wd = 0.085; ctx.lineWidth = px(1); ctx.strokeStyle = COL.estateEdge; ctx.fillStyle = COL.estate;
    for(const e of G.estates){ ctx.save(); ctx.translate(e.c[0], e.c[1]); ctx.rotate(e.a); ctx.fillRect(-L, -Wd, 2*L, 2*Wd); ctx.strokeRect(-L, -Wd, 2*L, 2*Wd); ctx.restore(); } }
  strokeLines(G.bridges, cw + px(1.5), '#8a8598', 'butt');
  strokeLines(G.roads, rw, COL.road); strokeLines(G.bridges, rw, COL.road); strokeLines(hill, rw, COL.road);
  if(G.pier){ strokeLines([G.pier], 0.16, COL.wood, 'butt'); ctx.fillStyle = COL.wood; ctx.beginPath(); ctx.arc(G.pier[1][0], G.pier[1][1], 0.34, 0, 7); ctx.fill();
    ctx.fillStyle = '#3f7d95'; ctx.beginPath(); ctx.arc(G.pier[1][0], G.pier[1][1], 0.17, 0, 7); ctx.fill();
    strokeLines([G.causeway], cw + px(2), COL.hwyCase, 'butt'); strokeLines([G.causeway], rw*1.4, COL.hwy, 'butt'); }
  if(MARINA){ ctx.strokeStyle = '#8f8a82'; ctx.lineWidth = Math.max(0.06, px(2)); ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(MARINA.x, MARINA.y, MARINA.r*1.02, Math.PI*0.62, Math.PI*1.55); ctx.stroke();
    ctx.strokeStyle = COL.wood; ctx.lineWidth = Math.max(0.03, px(1.2)); for(let k = 0; k < 4; k++){ const y = MARINA.y - 0.45 + k*0.3; ctx.beginPath(); ctx.moveTo(MARINA.x + 0.55, y); ctx.lineTo(MARINA.x + 0.05, y); ctx.stroke(); } }
  strokeLines(G.hwy, cw*1.5, COL.hwyCase); strokeLines(G.hwy, rw*1.5, COL.hwy);
  drawLabels();
}
function labelAt(text, u, v, size, opt){
  opt = opt || {};
  const W = innerWidth, H = innerHeight, x = W/2 + (u - view.cx)*view.s, y = H/2 + (v - view.cy)*view.s;
  if(x < -200 || x > W + 200 || y < -200 || y > H + 200) return;
  ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, dpr*x, dpr*y); if(opt.rot) ctx.rotate(opt.rot);
  ctx.font = (opt.font || `700 ${size}px 'Space Grotesk', sans-serif`); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if('letterSpacing' in ctx) ctx.letterSpacing = (opt.ls ?? 0.18*size) + 'px';
  ctx.lineWidth = 3; ctx.strokeStyle = opt.halo || 'rgba(255,255,255,.55)'; ctx.lineJoin = 'round'; ctx.strokeText(text, 0, 0);
  ctx.fillStyle = opt.col || '#2f3a33'; ctx.fillText(text, 0, 0); ctx.restore();
}
function drawLabels(){
  const z = view.s, big = clamp(z*0.42, 10, 26), mid = clamp(z*0.3, 9, 18);
  labelAt('PACIFIC OCEAN', -4.6, 14.5, big*1.15, { rot: -Math.PI/2, font: `italic 600 ${big*1.15}px Georgia, serif`, col: 'rgba(255,255,255,.92)', halo: 'rgba(40,90,130,.35)' });
  const xs = -2.15 + T*(wWlo(4.5) + wWhi(4.5)) - 0.45; labelAt('SUNSET SHORE', xs, 4.5, mid, { rot: -Math.PI/2, col: '#6c5a2c' });
  labelAt('DRIFTWOOD BEACH', 9.5, N + 2.15 + T*(wSlo(9.5) + wShi(9.5)) + 0.55, mid, { col: '#6c5a2c', halo: 'rgba(40,90,130,.3)' });
  labelAt('SIERRA PALMA', 4.6, -4.2, big, { col: '#24382c' });
  labelAt('MIRADOR HILLS', N + 3.6, 4.5, big, { rot: -Math.PI/2, col: '#24382c' });
  if(T > 0.2 && G && G.riverPoly){ const k = Math.round(RIVER.length*0.72), a = RIVER[k - 3], b = RIVER[k + 3];
    labelAt('PALMA RIVER', RIVER[k][0] + 0.55, RIVER[k][1], mid*0.85, { rot: Math.atan2(b[1] - a[1], b[0] - a[0]) + (b[1] < a[1] ? Math.PI : 0), col: '#1f5f86' });
    labelAt('SIERRA VISTA', G.sierra[Math.floor(G.sierra.length*0.6)][0], G.sierra[Math.floor(G.sierra.length*0.6)][1] - 0.5, mid*0.8, { col: '#4a3f2a' });
    labelAt('MIRADOR HEIGHTS', G.mirador[Math.floor(G.mirador.length*0.6)][0] + 0.6, G.mirador[Math.floor(G.mirador.length*0.6)][1], mid*0.8, { rot: -Math.PI/2, col: '#4a3f2a' });
    if(G.skyline.length > 40){ const q = G.skyline[Math.floor(G.skyline.length*0.55)]; labelAt('SKYLINE DR', q[0], q[1] - 0.3, mid*0.7, { col: '#24382c' }); }
    labelAt('DRIFTWOOD KEY', ISLES[2][0], ISLES[2][1] + 1.75, mid*0.8, { col: '#6c5a2c', halo: 'rgba(40,90,130,.3)' });
    labelAt('SUNSET PIER', G.pier[1][0] + 0.9, G.pier[1][1] - 0.7, mid*0.75, { col: '#fff', halo: 'rgba(40,90,130,.45)' });
    labelAt('PELICAN MARINA', MARINA.x - 1.3, MARINA.y, mid*0.75, { rot: -Math.PI/2, col: '#fff', halo: 'rgba(40,90,130,.45)' });
  }
  if(G && G.hwy.length){ const P = G.hwy[0], k = Math.floor(P.length*0.3), a = P[k - 3], b = P[k + 3]; labelAt('COAST HWY', P[k][0] - 0.35, P[k][1], mid*0.7, { rot: Math.atan2(b[1] - a[1], b[0] - a[0]) + (b[1] < a[1] ? Math.PI : 0) - Math.PI, col: '#6b5418' }); }
}
function refreshStats(){
  const kept = G.blocks.filter(b => !b.wet).length;
  document.getElementById('stats').textContent = T > 0
    ? `${kept} of ${G.blocks.length} parcels kept · ${G.bent} of ${edges.length} street links bent · ${G.toPark} turned riverside park · ${G.lostSea} given to the sea · ${G.lostHill} edge lots left to the hills`
    : `Grid today: ${G.blocks.length} parcels, ${edges.length} straight street links.`;
}

/* ===== controls ===== */
let lowTimer = 0;
function setT(t, final){
  T = t; build();
  renderTerrain(final ? 34 : 9); need = true;
  document.getElementById('bend').value = Math.round(t*100); document.getElementById('bendVal').textContent = Math.round(t*100) + '%';
  document.getElementById('bGrid').classList.toggle('on', t === 0); document.getElementById('bNat').classList.toggle('on', t > 0);
  if(!final){ clearTimeout(lowTimer); lowTimer = setTimeout(() => setT(T, true), 260); }
}
function tweenTo(t1){ const t0 = T, start = performance.now(), D = 700;
  const step = now => { const k = clamp((now - start)/D, 0, 1), e = k*k*(3 - 2*k); setT(lerp(t0, t1, e), k >= 1); if(k < 1) requestAnimationFrame(step); };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) setT(t1, true); else requestAnimationFrame(step); }
document.getElementById('bGrid').onclick = () => tweenTo(0);
document.getElementById('bNat').onclick = () => tweenTo(1);
document.getElementById('bend').oninput = e => setT(e.target.value/100, false);
document.getElementById('bTopo').onclick = e => { showTopo = !showTopo; e.currentTarget.classList.toggle('on', showTopo); renderTerrain(34); need = true; };
document.getElementById('bInfo').onclick = e => { const p = document.getElementById('plate'); p.classList.toggle('min'); e.currentTarget.textContent = p.classList.contains('min') ? 'Show key' : 'Hide key'; };

/* pan / pinch / wheel */
const ptr = new Map(); let pinch = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]);
  if(ptr.size === 2){ const [a, b] = [...ptr.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: view.s, m: [(a[0] + b[0])/2, (a[1] + b[1])/2], cx: view.cx, cy: view.cy }; } });
cv.addEventListener('pointermove', e => { if(!ptr.has(e.pointerId)) return; const prev = ptr.get(e.pointerId), cur = [e.clientX, e.clientY]; ptr.set(e.pointerId, cur);
  if(ptr.size === 1){ view.cx -= (cur[0] - prev[0])/view.s; view.cy -= (cur[1] - prev[1])/view.s; need = true; }
  else if(ptr.size === 2 && pinch){ const [a, b] = [...ptr.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0])/2, (a[1] + b[1])/2];
    const s = clamp(pinch.s*d/pinch.d, 8, 600), W = innerWidth, H = innerHeight;
    const wu = pinch.cx + (pinch.m[0] - W/2)/pinch.s, wv = pinch.cy + (pinch.m[1] - H/2)/pinch.s;
    view.s = s; view.cx = wu - (m[0] - W/2)/s; view.cy = wv - (m[1] - H/2)/s; need = true; } });
const up = e => { ptr.delete(e.pointerId); if(ptr.size < 2) pinch = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); const W = innerWidth, H = innerHeight, k = Math.exp(-e.deltaY*0.0015), s = clamp(view.s*k, 8, 600);
  const wu = view.cx + (e.clientX - W/2)/view.s, wv = view.cy + (e.clientY - H/2)/view.s; view.s = s; view.cx = wu - (e.clientX - W/2)/s; view.cy = wv - (e.clientY - H/2)/s; need = true; }, { passive: false });
cv.addEventListener('dblclick', () => { fit(); need = true; });
addEventListener('resize', () => { resize(); });

resize(); fit(); setT(1, true);
(function loop(){ if(need) draw(); requestAnimationFrame(loop); })();
</script>
