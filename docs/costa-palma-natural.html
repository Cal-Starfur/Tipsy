<title>Costa Palma Natural Survey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a full-bleed survey map; one title plate top-left, one control strip along the bottom. */
:root{
  --plate:#f3f1f6; --ink:#262833; --ink-soft:#5d6070; --line:#b9b6c6; --accent:#e0703a; --shadow:rgba(38,40,51,.18);
  --sea:#4f8fbd;
  --display:'Space Grotesk', -apple-system, 'Helvetica Neue', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --plate:#1f212a; --ink:#eceaf2; --ink-soft:#a6a8b8; --line:#454857; --accent:#f08a55; --shadow:rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{ --plate:#1f212a; --ink:#eceaf2; --ink-soft:#a6a8b8; --line:#454857; --accent:#f08a55; --shadow:rgba(0,0,0,.45); color-scheme:dark }
html,body{ height:100%; overflow:hidden; }
body{ background:var(--sea); color:var(--ink); font:13px/1.4 var(--mono); -webkit-tap-highlight-color:transparent; }
#cv{ position:fixed; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; display:block; }
#plate{ position:fixed; z-index:5; top:calc(12px + env(safe-area-inset-top, 0px)); left:max(16px, env(safe-area-inset-left, 0px));
  background:var(--plate); border:1.5px solid var(--ink); box-shadow:5px 5px 0 var(--shadow); max-width:min(380px, calc(100vw - 32px)); }
#plate .row{ padding:9px 14px; border-bottom:1px solid var(--line); }
#plate .row:last-child{ border-bottom:none; }
#plate h1{ font:700 16px/1.1 var(--display); letter-spacing:.08em; text-transform:uppercase; text-wrap:balance; }
#plate h1 span{ color:var(--accent); }
#sub{ font-size:11px; color:var(--ink-soft); margin-top:3px; }
#legend{ display:flex; flex-wrap:wrap; gap:6px 12px; font-size:11px; }
#legend i{ display:inline-block; width:11px; height:11px; margin-right:4px; vertical-align:-1px; border:1px solid rgba(0,0,0,.25); }
#stats{ font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
#plate.min #legend, #plate.min #stats{ display:none; }
#bar{ position:fixed; z-index:5; left:0; right:0; bottom:0; display:flex; flex-wrap:wrap; gap:8px; align-items:stretch;
  padding:0 max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); pointer-events:none; }
#bar > *{ pointer-events:auto; }
.seg{ display:flex; border:1.5px solid var(--ink); box-shadow:4px 4px 0 var(--shadow); background:var(--plate); }
.seg button, .tool{ font:600 12px var(--mono); letter-spacing:.04em; color:var(--ink); background:var(--plate); border:none; padding:10px 14px; min-height:44px; cursor:pointer; }
.seg button + button{ border-left:1.5px solid var(--ink); }
.seg button.on{ background:var(--ink); color:var(--plate); }
.tool{ border:1.5px solid var(--ink); box-shadow:4px 4px 0 var(--shadow); }
.tool.on{ background:var(--ink); color:var(--plate); }
button:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
#bendBox{ display:flex; align-items:center; gap:10px; padding:0 14px; border:1.5px solid var(--ink); box-shadow:4px 4px 0 var(--shadow); background:var(--plate); min-height:44px; flex:1 1 220px; max-width:420px; }
#bendBox label{ font-weight:600; font-size:12px; letter-spacing:.04em; }
#bend{ flex:1; min-width:0; accent-color:var(--accent); }
#bendVal{ width:3.2em; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-soft); }
</style>

<canvas id="cv"></canvas>

<div id="plate">
  <div class="row">
    <h1>Costa Palma <span>· natural survey</span></h1>
    <div id="sub">Prototype. Same parcels as the game, bent to the land: the coast, the hills and a river.</div>
  </div>
  <div class="row" id="legend">
    <span><i style="background:#c3bdd8"></i>commercial</span>
    <span><i style="background:#e8e0d1"></i>housing</span>
    <span><i style="background:#93be8c"></i>park</span>
    <span><i style="background:#f1dc8c"></i>highway</span>
    <span><i style="background:#e6d39f"></i>beach</span>
    <span><i style="background:#6f9a7f"></i>hills</span>
    <span><i style="background:#69acd3"></i>river / sea</span>
    <span><i style="background:#f5efe3"></i>hill estates</span>
  </div>
  <div class="row" id="stats"></div>
</div>

<div id="bar">
  <div class="seg" role="group" aria-label="Map version">
    <button id="bGrid" type="button">Grid today</button>
    <button id="bNat" type="button" class="on">Natural</button>
  </div>
  <div id="bendBox"><label for="bend">Bend</label><input id="bend" type="range" min="0" max="100" value="100"><span id="bendVal">100%</span></div>
  <button id="bTopo" type="button" class="tool on">Contours</button>
  <button id="bInfo" type="button" class="tool">Hide key</button>
</div>

/* ===== terrain raster: land, sea, hillshade, contours; plus a water-only layer over the town ===== */
let terrain = document.createElement('canvas'), waterTop = document.createElement('canvas'), showTopo = true;
function renderTerrain(ppb){
  const W = Math.round((X1 - X0)*ppb), H = Math.round((Y1 - Y0)*ppb);
  const hA = new Float32Array(W*H), sA = new Float32Array(W*H), mA = new Float32Array(W*H);
  const colLo = new Float32Array(W), colHi = new Float32Array(W);
  for(let x = 0; x < W; x++){ const u = X0 + (x + 0.5)/ppb; colLo[x] = u; }
  for(let y = 0; y < H; y++){ const v = Y0 + (y + 0.5)/ppb;
    for(let x = 0; x < W; x++){ const u = colLo[x], o = y*W + x, s = landS(u, v), m = mtn(u, v);
      sA[o] = s; mA[o] = m; hA[o] = s > 0 ? elev(u, v, s, m) : 0; } }
  terrain.width = waterTop.width = W; terrain.height = waterTop.height = H;
  const tc = terrain.getContext('2d'), wc = waterTop.getContext('2d');
  const ti = tc.createImageData(W, H), wi = wc.createImageData(W, H), td = ti.data, wd = wi.data;
  const LAND = [[0, [140,178,146]], [0.22, [108,150,122]], [0.55, [96,132,110]], [0.8, [138,148,122]], [1.05, [190,190,172]]];
  const landCol = h => { for(let k = 1; k < LAND.length; k++) if(h <= LAND[k][0]){ const [a, ca] = LAND[k - 1], [b, cb] = LAND[k], t = (h - a)/(b - a);
    return [lerp(ca[0], cb[0], t), lerp(ca[1], cb[1], t), lerp(ca[2], cb[2], t)]; } return LAND[LAND.length - 1][1]; };
  const K = 0.55*ppb, CL = 16;
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
    const o = y*W + x, s = sA[o], p = o*4; let c;
    if(s <= 0){
      const dep = smooth(0, 2.6, -s);
      c = [lerp(116, 60, dep), lerp(182, 128, dep), lerp(214, 180, dep)];
      if(-s < 0.045){ c = [lerp(c[0], 236, 0.6), lerp(c[1], 246, 0.6), lerp(c[2], 250, 0.6)]; }
      else if(-s < 0.32){ const sh = 0.18*(1 - (-s)/0.32); c = [lerp(c[0], 150, sh), lerp(c[1], 205, sh), lerp(c[2], 222, sh)]; }
      wd[p] = c[0]; wd[p + 1] = c[1]; wd[p + 2] = c[2]; wd[p + 3] = 255;
    } else {
      const h = hA[o], u = X0 + (x + 0.5)/ppb, v = Y0 + (y + 0.5)/ppb;
      const sandW = (0.34 + 0.14*fbm(u/2, v/2, 81, 2))*(1 - smooth(0.25, 0.6, mA[o]));
      const iw = inlandW(u, v, s);
      if(iw > 0){ const dep = smooth(0, 0.35, iw); c = [lerp(126, 84, dep), lerp(190, 152, dep), lerp(214, 196, dep)];
        if(iw < 0.025) c = [lerp(c[0], 220, 0.45), lerp(c[1], 236, 0.45), lerp(c[2], 240, 0.45)];
        td[p] = c[0]; td[p + 1] = c[1]; td[p + 2] = c[2]; td[p + 3] = 255; continue; }
      if(s < sandW) c = [230, 214, 162];
      else c = landCol(h);
      if(T > 0 && v > NY + 0.6 && s < 1.8 && s >= sandW){ const rd = riverD(u, v), mk = (1 - smooth(0.35, 1.1, rd))*T;   // the estuary's marsh
        if(mk > 0){ const wet = fbm(u*5, v*5, 221, 2) > 0.25 && rd < 0.8; c = wet ? [lerp(c[0], 120, mk), lerp(c[1], 182, mk), lerp(c[2], 204, mk)] : [lerp(c[0], 128, mk), lerp(c[1], 158, mk), lerp(c[2], 118, mk)]; } }
      const hl = hA[x > 0 ? o - 1 : o], hr = hA[x < W - 1 ? o + 1 : o], hu = hA[y > 0 ? o - W : o], hd = hA[y < H - 1 ? o + W : o];
      const sh = clamp(1 + ((hl - hr) + (hu - hd))*K, 0.62, 1.28);
      c = [c[0]*sh, c[1]*sh, c[2]*sh];
      if(showTopo && h > 0.09 && (Math.floor(h*CL) !== Math.floor(hr*CL) || Math.floor(h*CL) !== Math.floor(hd*CL))){ c = [c[0]*0.86, c[1]*0.88, c[2]*0.86]; }
      if(s < 0.03){ c = [lerp(c[0], 214, 0.5), lerp(c[1], 198, 0.5), lerp(c[2], 150, 0.5)]; }
    }
    td[p] = c[0]; td[p + 1] = c[1]; td[p + 2] = c[2]; td[p + 3] = 255;

}

/* ===== geometry: everything built in grid space, then warped ===== */
let G = null;
function warpRect(x0, y0, x1, y1, per){
  const pts = [], side = (ax, ay, bx, by) => { for(let k = 0; k < per; k++){ const t = k/per; pts.push(warp(lerp(ax, bx, t), lerp(ay, by, t))); } };

function warpLine(ax, ay, bx, by, n){ const pts = []; for(let k = 0; k <= n; k++){ const t = k/n; pts.push(warp(lerp(ax, bx, t), lerp(ay, by, t))); } return pts; }
function nearRiver(p){ let best = 9, w = 0; for(let k = 0; k < RIVER.length; k++){ const d = Math.hypot(p[0] - RIVER[k][0], p[1] - RIVER[k][1]); if(d < best){ best = d; w = riverW(RIVER[k][1]); } } return best - w; }
function chaikin(P, n){ for(let r = 0; r < n; r++){ const Q = [P[0]]; for(let i = 0; i < P.length - 1; i++){ const a = P[i], b = P[i + 1];
  Q.push([0.75*a[0] + 0.25*b[0], 0.75*a[1] + 0.25*b[1]], [0.25*a[0] + 0.75*b[0], 0.25*a[1] + 0.75*b[1]]); } Q.push(P[P.length - 1]); P = Q; } return P; }
function splitDry(P, min){ const out = []; let cur = []; for(const p of P){ if(landS(p[0], p[1]) > min) cur.push(p); else { if(cur.length > 1) out.push(cur); cur = []; } } if(cur.length > 1) out.push(cur); return out; }
const inPlate = p => p[0] > X0 + 0.2 && p[0] < X1 - 0.2 && p[1] > Y0 + 0.2 && p[1] < Y1 - 0.2;

/* a road that climbs a slope the way a real one does: along the contour, a little uphill, hairpin, back */
function switchback(start, o){
  let p = start.slice(), side = o.side; const pts = [p.slice()];

  for(let L = 0; L < o.legs; L++){
    for(let d = 0; d < o.leg; d += o.step){
      const g = grad(p[0], p[1]), gl = Math.hypot(g[0], g[1]) || 1e-6;
      let dx = -g[1]/gl*side + o.climb*g[0]/gl, dy = g[0]/gl*side + o.climb*g[1]/gl; const dl = Math.hypot(dx, dy); dx /= dl; dy /= dl;

      if(!inPlate(q) || landS(q[0], q[1]) < 0.3 || nearRiver(q) < 0.12 || lakeS(q[0], q[1]) > -0.1) break;
      p = q; pts.push(p.slice());
    }
    side = -side;
  }

function build(){
  MARINA = T > 0 ? { x: -2.15 + T*(wWlo(-2.2) + wWhi(-2.2)) + 0.45, y: -2.2, r: 0.8*T } : null;
  const byIJ = new Map(blocks.map(b => [b.i + ',' + b.j, b]));
  let lostSea = 0, lostRiver = 0, cutRiver = 0, lostHill = 0;
  /* parcels keep their use; the river runs between them and they hug its banks; the sea takes what it reaches */
  for(const b of blocks.concat(lots)){

    b.wet = b.poly.filter(p => landS(p[0], p[1]) < 0.05).length > b.poly.length*0.3;
    b.hill = !b.wet && T > 0.3 && !!b.ext && (b.y0 < 0 || b.x0 >= NX) && !inFlats(b.x0, b.y0 + 0.7) && fbm(b.x0*0.55 + 0.3, b.y0*0.55, 101, 2) > 0.12;

    if(T > 0.15){ const inR = b.poly.filter(p => nearRiver(p) < 0.03).length;

  }
  const isPark = (i, j) => { const b = byIJ.get(i + ',' + j); return !!b && !b.wet && b.eff === 'park'; };
  const OV = 0.03;
  for(const b of blocks){ if(b.wet || b.eff !== 'park') continue;
    const x0 = isPark(b.i - 1, b.j) ? b.i - OV : b.x0, x1 = isPark(b.i + 1, b.j) ? b.i + 1 + OV : b.x1;
    const y0 = isPark(b.i, b.j - 1) ? b.j - OV : b.y0, y1 = isPark(b.i, b.j + 1) ? b.j + 1 + OV : b.y1;
    b.poly = warpRect(x0, y0, x1, y1, 6); }
  /* streets: swallowed between parks, gone where they'd run in the river or the sea, bridges where they cross */
  const roads = [], bridges = []; let flatN = 0, flatBent = 0, bent = 0, nBridge = 0, cutStreets = 0;
  for(const e of edges){
    const pts = warpLine(e.ax, e.ay, e.bx, e.by, 20), n = pts.length - 1;

    let k = 0;

      if(!w0) roads.push(pts.slice(Math.max(0, k - 1), Math.min(n, k1 + 1) + 1));
      else if(k > 0 && k1 < n){                                        // water with dry street both sides
        const a = pts[k - 1], b = pts[k1 + 1], span = Math.hypot(b[0] - a[0], b[1] - a[1]);
        const w = riverW((a[1] + b[1])/2);
        const kr = nearestK([(a[0] + b[0])/2, (a[1] + b[1])/2]), r0 = RIVER[Math.max(0, kr - 2)], r1 = RIVER[Math.min(RIVER.length - 1, kr + 2)], rc = RIVER[kr];
        const tx = r1[0] - r0[0], ty = r1[1] - r0[1], sideA = tx*(a[1] - rc[1]) - ty*(a[0] - rc[0]), sideB = tx*(b[1] - rc[1]) - ty*(b[0] - rc[0]);
        const cosA = Math.abs(tx*(b[0] - a[0]) + ty*(b[1] - a[1]))/(Math.hypot(tx, ty)*span || 1);
        if(sideA*sideB < 0 && cosA < 0.65 && span < 2*w + 0.4){ bridges.push(pts.slice(k - 1, k1 + 2)); nBridge++; } else cutStreets++;
      } else cutStreets++;
      k = k1 + 1;
    }
    const dev = pts.reduce((m, p, k) => { const t = k/n, gx = lerp(pts[0][0], pts[n][0], t), gy = lerp(pts[0][1], pts[n][1], t); return Math.max(m, Math.hypot(p[0] - gx, p[1] - gy)); }, 0);
    const ang = Math.abs(Math.atan2(pts[n][1] - pts[0][1], pts[n][0] - pts[0][0]) % (Math.PI/2));
    const isB = dev > 0.04 || Math.min(ang, Math.PI/2 - ang) > 0.08; if(isB) bent++;
    if(inFlats(e.ax, e.ay) && inFlats(e.bx, e.by)){ flatN++; if(isB) flatBent++; }
  }
  /* the streets run on past the ring lots to the coast road and the hills */
  const stubs = [];
  for(let i = 0; i <= NX; i++) stubs.push(warpLine(i, NY, i, NY + 0.95, 4));
  for(let j = 1; j <= NY; j++) stubs.push(warpLine(-0.95, j, 0, j, 4));
  const out = { roads: roads.concat(stubs.filter(p => !p.some(q => landS(q[0], q[1]) < 0.05))), bridges, flatN, flatBent, lostSea, lostRiver, cutRiver, nBridge, cutStreets, bent, lostHill };

  /* the coast highway: one ring in grid space round the west and south, warped, so it rides the coast's swell */
  const hw = []; const R = 1.3, xL = -0.95, yB = NY + 0.95;
  for(let v = 0.6; v <= yB - R; v += 0.1) hw.push([xL, v]);
  for(let a = 0; a <= 16; a++){ const t = Math.PI - a/16*Math.PI/2; hw.push([xL + R + R*Math.cos(t), yB - R + R*Math.sin(t)]); }

    if(out.skyline.length > 2 && out.skyline[out.skyline.length - 1][0] < top[0]) out.skyline = contourRoad(top, -1, 30, 0.05);
    /* canyon road: up the river valley on its east bank */
    const cy = []; for(let k = 0; k < RIVER.length; k++){ const [u, v] = RIVER[k]; if(v > 0.2 || v < -5.3) continue;
      const a = RIVER[Math.max(0, k - 1)], b = RIVER[Math.min(RIVER.length - 1, k + 1)], tx = b[0] - a[0], ty = b[1] - a[1], tl = Math.hypot(tx, ty) || 1;

    for(const road of [out.sierra, out.mirador]){
      let acc = 0; for(let k = 1; k < road.length; k++){
        const a = road[k - 1], b = road[k]; acc += Math.hypot(b[0] - a[0], b[1] - a[1]);
        if(acc < 0.3 || k < road.length*0.12) continue; acc = 0;
        const tx = b[0] - a[0], ty = b[1] - a[1], tl = Math.hypot(tx, ty) || 1, nx = -ty/tl, ny = tx/tl;
        for(const sd of [-1, 1]){ const c = [b[0] + nx*sd*0.2, b[1] + ny*sd*0.2];

          out.estates.push({ c, a: Math.atan2(ty, tx) }); }
      }
    }
    /* the pier off Sunset Shore, the causeway to Driftwood Key */
    const ps = warp(-0.95, 15); let px = ps[0]; while(landS(px, ps[1]) > -1.9 && px > X0 + 0.5) px -= 0.05;
    out.pier = [ps, [px, ps[1]]];
    const isle = ISLES[2], cs = warp(isle[0], NY + 0.95);

    const rk = Math.min(1, T*1.5);

    out.bankBand = ribbon(RIVER, k => (riverW(RIVER[k][1]) + 0.13)*rk);
    out.bank = [];
    for(const sd of [-1, 1]){ let cur = [];
      for(let k = 0; k < RIVER.length; k++){
        const a = RIVER[Math.max(0, k - 1)], b = RIVER[Math.min(RIVER.length - 1, k + 1)], tx = b[0] - a[0], ty = b[1] - a[1], tl = Math.hypot(tx, ty) || 1;
        const off = (riverW(RIVER[k][1]) + 0.085)*rk, q = [RIVER[k][0] - ty/tl*off*sd, RIVER[k][1] + tx/tl*off*sd], g = unwarp(q);

      if(cur.length > 2) out.bank.push(cur); }
    out.cityClip = new Path2D(); for(const b of blocks.concat(lots)) if(!b.hill) out.cityClip.addPath(polyPath(b.cell || b.poly, true));
    /* the dam across the river below Lake Palma */
    { let kd = 0, bd = 9; for(let k = 0; k < RIVER.length; k++){ const d = Math.hypot(RIVER[k][0] - 25.3, RIVER[k][1] + 2.75); if(d < bd){ bd = d; kd = k; } }
      const a = RIVER[kd - 1], b = RIVER[kd + 1], tx = b[0] - a[0], ty = b[1] - a[1], tl = Math.hypot(tx, ty), c = RIVER[kd];

    out.ponds = [];
    const pk = (i, j) => { const b = byIJ.get(i + ',' + j); return !!b && !b.wet && b.type === 'park'; };
    const used = new Set();
    for(const b of blocks){ if(!pk(b.i, b.j) || used.has(b.i + ',' + b.j) || inFlats(b.i + 1, b.j + 1)) continue;
      if(pk(b.i + 1, b.j) && pk(b.i, b.j + 1) && pk(b.i + 1, b.j + 1)){
        for(const [di, dj] of [[0,0],[1,0],[0,1],[1,1]]) used.add((b.i + di) + ',' + (b.j + dj));
        out.ponds.push(pond(warp(b.i + 1, b.j + 1), 0.5*T, b.i*31 + b.j)); }
      else if(h2(b.i, b.j, 7) < 0.4){ used.add(b.i + ',' + b.j); out.ponds.push(pond(warp(b.i + 0.5, b.j + 0.5), 0.17*T, b.i*31 + b.j)); }
    }

  G = out; G.blocks = blocks.concat(lots);

}
function nearestK(p){ let bk = 0, bd = 1e9; for(let k = 0; k < RIVER.length; k++){ const d = (p[0] - RIVER[k][0])**2 + (p[1] - RIVER[k][1])**2; if(d < bd){ bd = d; bk = k; } } return bk; }
function unwarp(p){ let g = p.slice(); for(let k = 0; k < 6; k++){ const w = warp(g[0], g[1]); g = [g[0] + p[0] - w[0], g[1] + p[1] - w[1]]; } return g; }

  P.push([c[0] + Math.cos(a)*rr*1.15, c[1] + Math.sin(a)*rr*0.85]); } return P; }

  return L.concat(R.reverse()); }

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let view = { cx: (X0 + X1)/2, cy: (Y0 + Y1)/2, s: 30 }, dpr = 1, need = true;
function clampView(){ const W = innerWidth, H = innerHeight, sMin = Math.max(W/(X1 - X0), H/(Y1 - Y0));
  if(view.s < sMin) view.s = sMin;
  const hw = W/2/view.s, hh = H/2/view.s; view.cx = clamp(view.cx, X0 + hw, X1 - hw); view.cy = clamp(view.cy, Y0 + hh, Y1 - hh); }
function fit(){ const W = innerWidth, H = innerHeight; view.s = Math.min(W/(NX + 10), H/(NY + 11)); view.cx = NX/2 - 1; view.cy = NY/2 + 0.6; clampView(); }
function resize(){ dpr = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; need = true; }
const COL = { commercial: '#c3bdd8', housing: '#e8e0d1', park: '#93be8c', pave: '#d8d4e2', quay: '#cfcad9', road: '#fdfcf8', casing: '#a49fb6',
  hwy: '#f1dc8c', hwyCase: '#b99a4a', river: '#69acd3', riverEdge: '#4f93bf', estate: '#f5efe3', estateEdge: '#b9ad94', wood: '#c4956a' };
function polyPath(P, close){ const p = new Path2D(); P.forEach((q, k) => k ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); if(close) p.closePath(); return p; }
function strokeLines(list, w, col, cap){ ctx.lineWidth = w; ctx.strokeStyle = col; ctx.lineCap = cap || 'round'; ctx.lineJoin = 'round'; for(const P of list) ctx.stroke(polyPath(P)); }
function px(n){ return n/view.s; }
function draw(){
  need = false; clampView();
  const W = innerWidth, H = innerHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#4c8cbc'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(dpr*view.s, 0, 0, dpr*view.s, dpr*(W/2 - view.cx*view.s), dpr*(H/2 - view.cy*view.s));
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(terrain, X0, Y0, X1 - X0, Y1 - Y0);
  if(!G) return;
  /* the town's ground: the ring of everything inside the coast road */
  ctx.fillStyle = COL.pave; for(const b of G.blocks) if(!b.wet) ctx.fill(polyPath(b.cell, true));
  for(const b of G.blocks){ if(b.wet) continue; ctx.fillStyle = COL[b.eff]; ctx.fill(polyPath(b.poly, true)); }
  ctx.drawImage(waterTop, X0, Y0, X1 - X0, Y1 - Y0);              // the sea over any of the town it reached
  const rw = Math.max(0.06, px(1.6)), cw = rw + Math.max(0.025, px(1.1));
  if(G.riverPoly){
    ctx.save(); ctx.clip(G.cityClip); ctx.fillStyle = COL.quay; ctx.fill(polyPath(G.bankBand, true)); ctx.restore();   // the parcels end at the quay
    ctx.fillStyle = COL.river; ctx.strokeStyle = COL.riverEdge; ctx.lineWidth = px(1);
    for(const P of [G.riverPoly, G.creekPoly].concat(G.ponds)){ const rp = polyPath(P, true); ctx.fill(rp); ctx.stroke(rp); }
    strokeLines([G.dam], Math.max(0.08, px(3)), '#8d8880', 'butt');
  }
  const hill = [G.sierra, G.mirador, G.skyline, G.canyon].filter(Boolean).concat(G.bank || []);
  strokeLines(G.roads, cw, COL.casing); strokeLines(hill, cw, COL.casing);
  if(G.estates){ const L = 0.11, Wd = 0.085; ctx.lineWidth = px(1); ctx.strokeStyle = COL.estateEdge; ctx.fillStyle = COL.estate;
    for(const e of G.estates){ ctx.save(); ctx.translate(e.c[0], e.c[1]); ctx.rotate(e.a); ctx.fillRect(-L, -Wd, 2*L, 2*Wd); ctx.strokeRect(-L, -Wd, 2*L, 2*Wd); ctx.restore(); } }
  strokeLines(G.bridges, cw + px(1.5), '#8a8598', 'butt');
  strokeLines(G.roads, rw, COL.road); strokeLines(G.bridges, rw, COL.road); strokeLines(hill, rw, COL.road);
  if(G.pier){ strokeLines([G.pier], 0.16, COL.wood, 'butt'); ctx.fillStyle = COL.wood; ctx.beginPath(); ctx.arc(G.pier[1][0], G.pier[1][1], 0.34, 0, 7); ctx.fill();
    ctx.fillStyle = '#3f7d95'; ctx.beginPath(); ctx.arc(G.pier[1][0], G.pier[1][1], 0.17, 0, 7); ctx.fill();
    strokeLines([G.causeway], cw + px(2), COL.hwyCase, 'butt'); strokeLines([G.causeway], rw*1.4, COL.hwy, 'butt'); }
  if(MARINA){ ctx.strokeStyle = '#8f8a82'; ctx.lineWidth = Math.max(0.06, px(2)); ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(MARINA.x, MARINA.y, MARINA.r*1.02, Math.PI*0.62, Math.PI*1.55); ctx.stroke();
    ctx.strokeStyle = COL.wood; ctx.lineWidth = Math.max(0.03, px(1.2)); for(let k = 0; k < 4; k++){ const y = MARINA.y - 0.45 + k*0.3; ctx.beginPath(); ctx.moveTo(MARINA.x + 0.55, y); ctx.lineTo(MARINA.x + 0.05, y); ctx.stroke(); } }
  strokeLines(G.hwy, cw*1.5, COL.hwyCase); strokeLines(G.hwy, rw*1.5, COL.hwy);
  /* the twelve hoods, The Flats outlined */
  ctx.setLineDash([px(6), px(5)]); ctx.lineWidth = px(1.4); ctx.strokeStyle = 'rgba(60,56,80,.45)';
  for(let c = 1; c < 4; c++) ctx.stroke(polyPath(warpLine(c*9, -0.6, c*9, NY + 0.6, 60)));
  for(let r = 1; r < 3; r++) ctx.stroke(polyPath(warpLine(-0.6, r*9, NX + 0.6, r*9, 90)));
  ctx.setLineDash([px(9), px(5)]); ctx.lineWidth = px(3); ctx.strokeStyle = '#e0703a';
  ctx.stroke(polyPath(warpRect(-0.75, -0.75, 9, 9, 30), true)); ctx.setLineDash([]);
  drawLabels();
}
function labelAt(text, u, v, size, opt){
  opt = opt || {};
  const W = innerWidth, H = innerHeight, x = W/2 + (u - view.cx)*view.s, y = H/2 + (v - view.cy)*view.s;
  if(x < -200 || x > W + 200 || y < -200 || y > H + 200) return;
  ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, dpr*x, dpr*y); if(opt.rot) ctx.rotate(opt.rot);
  ctx.font = (opt.font || `700 ${size}px 'Space Grotesk', sans-serif`); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if('letterSpacing' in ctx) ctx.letterSpacing = (opt.ls ?? 0.18*size) + 'px';
  ctx.lineWidth = 3; ctx.strokeStyle = opt.halo || 'rgba(255,255,255,.55)'; ctx.lineJoin = 'round'; ctx.strokeText(text, 0, 0);
  ctx.fillStyle = opt.col || '#2f3a33'; ctx.fillText(text, 0, 0); ctx.restore();
}
function drawLabels(){
  const z = view.s, big = clamp(z*0.42, 10, 26), mid = clamp(z*0.3, 9, 18);
  CITY.hoods.forEach((n, k) => { const c = k % 4, r = Math.floor(k/4), q = warp(c*9 + Math.min(9, NX - c*9)/2, r*9 + 4.5);
    labelAt(n.toUpperCase(), q[0], q[1], mid*0.95, k === 0 ? { col: '#b4501f', halo: 'rgba(255,255,255,.8)' } : { col: 'rgba(48,44,66,.75)', halo: 'rgba(255,255,255,.6)' }); });
  labelAt('PACIFIC OCEAN', -4.8, 18.5, big*1.15, { rot: -Math.PI/2, font: `italic 600 ${big*1.15}px Georgia, serif`, col: 'rgba(255,255,255,.92)', halo: 'rgba(40,90,130,.35)' });
  const xs = -2.15 + T*(wWlo(20) + wWhi(20)) - 0.45; labelAt('SUNSET SHORE', xs, 20, mid, { rot: -Math.PI/2, col: '#6c5a2c' });
  labelAt('DRIFTWOOD BEACH', 12, NY + 2.15 + T*(wSlo(12) + wShi(12)) + 0.55, mid, { col: '#6c5a2c', halo: 'rgba(40,90,130,.3)' });
  labelAt('SIERRA PALMA', 9, -4.6, big, { col: '#24382c' });
  labelAt('MIRADOR HILLS', NX + 3.6, 10, big, { rot: -Math.PI/2, col: '#24382c' });
  if(T > 0.2 && G && G.riverPoly){ const k = Math.round(RIVER.length*0.72), a = RIVER[k - 3], b = RIVER[k + 3];
    labelAt('PALMA RIVER', RIVER[k][0] + 0.55, RIVER[k][1], mid*0.85, { rot: Math.atan2(b[1] - a[1], b[0] - a[0]) + (b[1] < a[1] ? Math.PI : 0), col: '#1f5f86' });
    for(const L of LAKES) if(L.name) labelAt(L.name, L.x, L.y + L.ry + 0.45, mid*0.75, { col: '#1f5f86' });
    labelAt('DRIFTWOOD LAGOON', 27.3, NY + 2.15 + T*(wSlo(27.3) + wShi(27.3) + 0.75) - 0.95, mid*0.65, { col: '#1f5f86' });
    { const q = CREEK[Math.floor(CREEK.length*0.45)]; labelAt('MIRADOR CREEK', q[0], q[1] - 0.35, mid*0.65, { col: '#1f5f86' }); }
    labelAt('SIERRA VISTA', G.sierra[Math.floor(G.sierra.length*0.6)][0], G.sierra[Math.floor(G.sierra.length*0.6)][1] - 0.5, mid*0.8, { col: '#4a3f2a' });
    labelAt('MIRADOR HEIGHTS', G.mirador[Math.floor(G.mirador.length*0.6)][0] + 0.6, G.mirador[Math.floor(G.mirador.length*0.6)][1], mid*0.8, { rot: -Math.PI/2, col: '#4a3f2a' });
    if(G.skyline.length > 40){ const q = G.skyline[Math.floor(G.skyline.length*0.55)]; labelAt('SKYLINE DR', q[0], q[1] - 0.3, mid*0.7, { col: '#24382c' }); }
    labelAt('DRIFTWOOD KEY', ISLES[2][0], ISLES[2][1] + 1.75, mid*0.8, { col: '#6c5a2c', halo: 'rgba(40,90,130,.3)' });
    labelAt('SUNSET PIER', G.pier[1][0] + 0.9, G.pier[1][1] - 0.7, mid*0.75, { col: '#fff', halo: 'rgba(40,90,130,.45)' });
    labelAt('PELICAN MARINA', MARINA.x - 1.3, MARINA.y, mid*0.75, { rot: -Math.PI/2, col: '#fff', halo: 'rgba(40,90,130,.45)' });
  }
  if(G && G.hwy.length){ const P = G.hwy[0], k = Math.floor(P.length*0.3), a = P[k - 3], b = P[k + 3]; labelAt('COAST HWY', P[k][0] - 0.35, P[k][1], mid*0.7, { rot: Math.atan2(b[1] - a[1], b[0] - a[0]) + (b[1] < a[1] ? Math.PI : 0) - Math.PI, col: '#6b5418' }); }
}
function refreshStats(){
  const kept = G.blocks.filter(b => !b.wet).length;
  document.getElementById('stats').textContent = T > 0
    ? `The Flats: ${G.flatN - G.flatBent} of ${G.flatN} streets straight (${Math.round(100*(G.flatN - G.flatBent)/Math.max(1, G.flatN))}%), flat, no new water · ${kept} of ${G.blocks.length} parcels kept · ${G.bent} of ${edges.length} street links bent · ${G.nBridge} bridges · ${G.cutRiver} parcels on the river's banks · ${G.lostRiver} under it · ${G.lostSea} given to the sea · ${G.lostHill} edge lots left to the hills`
    : `Grid today: ${G.blocks.length} parcels, ${edges.length} straight street links.`;
}

/* ===== controls ===== */
let lowTimer = 0;
function setT(t, final){
  T = t; build();
  renderTerrain(final ? 26 : 7); need = true;
  document.getElementById('bend').value = Math.round(t*100); document.getElementById('bendVal').textContent = Math.round(t*100) + '%';
  document.getElementById('bGrid').classList.toggle('on', t === 0); document.getElementById('bNat').classList.toggle('on', t > 0);
  if(!final){ clearTimeout(lowTimer); lowTimer = setTimeout(() => setT(T, true), 260); }
}
function tweenTo(t1){ const t0 = T, start = performance.now(), D = 700;
  const step = now => { const k = clamp((now - start)/D, 0, 1), e = k*k*(3 - 2*k); setT(lerp(t0, t1, e), k >= 1); if(k < 1) requestAnimationFrame(step); };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) setT(t1, true); else requestAnimationFrame(step); }
document.getElementById('bGrid').onclick = () => tweenTo(0);
document.getElementById('bNat').onclick = () => tweenTo(1);
document.getElementById('bend').oninput = e => setT(e.target.value/100, false);
document.getElementById('bTopo').onclick = e => { showTopo = !showTopo; e.currentTarget.classList.toggle('on', showTopo); renderTerrain(26); need = true; };
document.getElementById('bInfo').onclick = e => { const p = document.getElementById('plate'); p.classList.toggle('min'); e.currentTarget.textContent = p.classList.contains('min') ? 'Show key' : 'Hide key'; };

/* pan / pinch / wheel */
const ptr = new Map(); let pinch = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]);
  if(ptr.size === 2){ const [a, b] = [...ptr.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: view.s, m: [(a[0] + b[0])/2, (a[1] + b[1])/2], cx: view.cx, cy: view.cy }; } });
cv.addEventListener('pointermove', e => { if(!ptr.has(e.pointerId)) return; const prev = ptr.get(e.pointerId), cur = [e.clientX, e.clientY]; ptr.set(e.pointerId, cur);
  if(ptr.size === 1){ view.cx -= (cur[0] - prev[0])/view.s; view.cy -= (cur[1] - prev[1])/view.s; need = true; }
  else if(ptr.size === 2 && pinch){ const [a, b] = [...ptr.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0])/2, (a[1] + b[1])/2];
    const s = clamp(pinch.s*d/pinch.d, 8, 600), W = innerWidth, H = innerHeight;
    const wu = pinch.cx + (pinch.m[0] - W/2)/pinch.s, wv = pinch.cy + (pinch.m[1] - H/2)/pinch.s;
    view.s = s; view.cx = wu - (m[0] - W/2)/s; view.cy = wv - (m[1] - H/2)/s; need = true; } });
const up = e => { ptr.delete(e.pointerId); if(ptr.size < 2) pinch = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); const W = innerWidth, H = innerHeight, k = Math.exp(-e.deltaY*0.0015), s = clamp(view.s*k, 8, 600);
  const wu = view.cx + (e.clientX - W/2)/view.s, wv = view.cy + (e.clientY - H/2)/view.s; view.s = s; view.cx = wu - (e.clientX - W/2)/s; view.cy = wv - (e.clientY - H/2)/s; need = true; }, { passive: false });
cv.addEventListener('dblclick', () => { fit(); need = true; });
addEventListener('resize', () => { resize(); });

resize(); fit(); setT(1, true);
(function loop(){ if(need) draw(); requestAnimationFrame(loop); })();
</script>
